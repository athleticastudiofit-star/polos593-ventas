<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polos593 — Ventas & Stock</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:#2e2e2e;
  --text:#f0ede8;--soft:#8a8a8a;--gold:#c9a84c;--green:#22c55e;--red:#ef4444;
  --yellow:#eab308;--blue:#3b82f6;--pink:#ec4899;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

/* Login */
#login{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:1000;padding:1.5rem}
#login h1{color:var(--gold);font-size:22px}
#login input,#login select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:.8rem 1rem;border-radius:10px;font-size:16px;width:260px;outline:none;text-align:center}
#login button{background:var(--gold);color:#000;border:none;padding:.8rem 1rem;border-radius:10px;font-weight:600;width:260px;font-size:16px}
.login-err{color:var(--red);font-size:13px;min-height:18px}

/* App shell */
#app{display:none;min-height:100vh;padding-bottom:70px}
.topbar{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:.8rem 1rem;display:flex;align-items:center;justify-content:space-between;z-index:50}
.topbar .brand{font-weight:700;color:var(--gold)}
.topbar .who{font-size:12px;color:var(--soft)}
.main{padding:1rem;max-width:900px;margin:0 auto}

/* Bottom nav (mobile-first) */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:50}
.nav button{flex:1;background:none;border:none;color:var(--soft);padding:.7rem;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:.2rem}
.nav button.active{color:var(--gold)}
.nav button svg{width:22px;height:22px}

/* Cards / general */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:1rem}
h2.page{font-size:18px;font-weight:600;margin-bottom:1rem}
.muted{color:var(--soft)}
.row{display:flex;gap:.6rem;align-items:center}
.btn{padding:.6rem 1rem;border-radius:9px;border:none;font-weight:600;font-size:14px}
.btn-gold{background:var(--gold);color:#000}
.btn-green{background:var(--green);color:#000}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-red{background:var(--red);color:#fff}
.btn:disabled{opacity:.5}
input.fld,select.fld{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:.6rem .7rem;border-radius:8px;font-size:14px;width:100%;outline:none}
input.fld:focus,select.fld:focus{border-color:var(--gold)}
label.lbl{font-size:12px;color:var(--soft);display:block;margin-bottom:.25rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.badge{display:inline-block;padding:.15rem .5rem;border-radius:20px;font-size:11px;font-weight:600}
.b-local{background:rgba(59,130,246,.15);color:var(--blue)}
.b-drop{background:rgba(236,72,153,.15);color:var(--pink)}
.b-cod{background:rgba(234,179,8,.15);color:var(--yellow)}
.nav-count{background:var(--red);color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:0 .35rem;margin-left:.2rem}
.env-card{border-left:3px solid var(--border)}
.env-card.st-por_despachar{border-left-color:var(--yellow)}
.env-card.st-en_camino{border-left-color:var(--blue)}
.env-card.st-entregado{border-left-color:var(--green)}
.env-card.st-depositado{border-left-color:var(--gold)}
.env-card.st-rechazado{border-left-color:var(--red);opacity:.7}
.b-low{background:rgba(239,68,68,.18);color:var(--red)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:.7rem 1.2rem;border-radius:10px;font-weight:600;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}

/* Asistente guiado de venta */
.wz-step{font-size:16px;font-weight:600;margin-bottom:.5rem}
.wz-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.wz-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:.9rem .5rem;font-size:14px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;min-height:74px;text-align:center;line-height:1.2}
.wz-btn:active{border-color:var(--gold);background:#2c2c2c}
.wz-btn .sub{font-size:11px;color:var(--soft);font-weight:400}
.wz-swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--border)}
.wz-crumb{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.7rem}
.wz-crumb span{background:rgba(201,168,76,.12);color:var(--gold);padding:.22rem .6rem;border-radius:20px;font-size:12px;font-weight:600}
.wz-back{background:none;border:none;color:var(--soft);font-size:13px;cursor:pointer;margin-left:auto;padding:.2rem .4rem}

/* Vender: buscador y carrito */
.prod-pick{display:flex;justify-content:space-between;align-items:center;padding:.55rem .3rem;border-bottom:1px solid var(--border);gap:.5rem}
.prod-pick small{color:var(--soft)}
.pick-add{background:var(--gold);color:#000;border:none;border-radius:7px;width:34px;height:34px;font-size:20px;font-weight:700;flex-shrink:0}
.cart-line{display:flex;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px solid var(--border)}
.qtybox{display:flex;align-items:center;gap:.3rem}
.qtybox button{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:16px;font-weight:700}
.seg{display:flex;gap:.4rem}
.seg button{flex:1;padding:.6rem;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:var(--soft);font-weight:600}
.seg button.on{background:var(--gold);color:#000;border-color:var(--gold)}
.totline{display:flex;justify-content:space-between;padding:.3rem 0}
.totline.big{font-size:18px;font-weight:700;border-top:1px solid var(--border);margin-top:.4rem;padding-top:.6rem}
.gain{color:var(--green)}

/* Tablas */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--soft);padding:.5rem .4rem;border-bottom:1px solid var(--border)}
td{padding:.5rem .4rem;border-bottom:1px solid var(--border);font-size:13px}
.cell-in{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:.3rem;width:62px;text-align:right;font-size:13px}

/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1rem}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.9rem}
.kpi .v{font-size:24px;font-weight:700}
.kpi .l{font-size:11px;color:var(--soft);text-transform:uppercase}
.bar-row{display:flex;align-items:center;gap:.5rem;margin:.3rem 0;font-size:12px}
.bar-track{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--gold)}
.empty{text-align:center;color:var(--soft);padding:2rem 1rem}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:1.2rem;width:100%;max-width:520px;max-height:85vh;overflow:auto}
@media(min-width:600px){.modal-bg{align-items:center}.modal-box{border-radius:16px}}
</style>
</head>
<body>

<!-- APP -->
<div id="app">

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box" id="modal-box"></div></div>

<script>
const SUPABASE_URL = 'https://zopeclhjnlfpgldflarp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EzKXkvdHpyPs_m_76J9kZg_l3BJIoor';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ENVIO = { guayaquil: 3.50, provincia: 6.50 };
// Contra entrega (Pardux): sale de Guayaquil, al cliente se le cobra $5 o $6 de envío y el
// costo real de Pardux (no es tarifa fija) se registra después, al cargar la guía en Envíos.
const COD_ENVIOS = [5, 6];
const EST_ENVIO = {
  por_despachar:{txt:'📝 Por despachar', badge:'b-cod'},
  en_camino:    {txt:'🚚 En camino',     badge:'b-local'},
  entregado:    {txt:'✅ Entregado y cobrado', badge:'b-local'},
  depositado:   {txt:'💰 Depositado',    badge:'b-local'},
  rechazado:    {txt:'↩️ Rechazado',     badge:'b-drop'}
};
const COD_COBRADO = v => v.tipo==='contraentrega' && (v.estado_envio==='entregado' || v.estado_envio==='depositado');
// Tarifa de comisión por prenda. Contra entrega solo paga cuando ya se entregó y cobró.
function tarifaCom(v){
  if(v.tipo==='contraentrega') return COD_COBRADO(v) ? parseFloat(CONFIG.comision_contraentrega||CONFIG.comision_dropship||'2') : 0;
  return v.tipo==='dropshipping' ? parseFloat(CONFIG.comision_dropship||'2') : parseFloat(CONFIG.comision_local||'1');
}
const TIPO_BADGE = t => t==='local' ? ['b-local','LOCAL','LOC'] : t==='contraentrega' ? ['b-cod','CONTRA ENTREGA','COD'] : ['b-drop','DROPSHIP','DROP'];
const BAILEYS_URL = 'https://whatsapp-baileys-production-3e0b.up.railway.app';
const ADMIN_NAMES = ['Homero'];          // quién ve Reportes e Inventario
let VENDEDOR = localStorage.getItem('p593_vendedor') || '';
let ES_ADMIN = localStorage.getItem('p593_admin') === '1';
let CONFIG = {};                          // pin, pin_admin, whatsapp_admin
let cart = [];
let productosCache = [];

const money = n => '$' + (Number(n)||0).toFixed(2);
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

// ── LOGIN ──
async function initLogin(){
  const { data } = await db.from('vendedores').select('nombre').eq('activo',true).order('nombre');
  const sel = document.getElementById('login-vendedor');
  sel.innerHTML = '<option value="">Elige tu nombre…</option>' + (data||[]).map(v=>`<option>${v.nombre}</option>`).join('');
  if (VENDEDOR && localStorage.getItem('p593_auth')==='1'){
    // Admin con sesión vieja sin rol guardado → pedir de nuevo el PIN de admin
    if (ADMIN_NAMES.includes(VENDEDOR) && localStorage.getItem('p593_admin')!=='1'){
      localStorage.removeItem('p593_auth');
      sel.value = VENDEDOR;
      return;
    }
    ES_ADMIN = localStorage.getItem('p593_admin')==='1';
    enterApp();
  }
}
async function loadConfig(){
  const { data } = await db.from('config').select('*');
  CONFIG = {}; (data||[]).forEach(c=>CONFIG[c.clave]=c.valor);
}
async function doLogin(){
  const v = document.getElementById('login-vendedor').value;
  const pin = document.getElementById('login-pin').value.trim();
  const err = document.getElementById('login-err');
  if(!v){ err.textContent='Elige tu nombre'; return; }
  await loadConfig();
  const esAdmin = ADMIN_NAMES.includes(v);
  const pinOk = esAdmin ? (pin === (CONFIG.pin_admin||'5930')) : (pin === (CONFIG.pin||'0593'));
  if(!pinOk){ err.textContent = esAdmin ? 'PIN de administrador incorrecto' : 'PIN incorrecto'; return; }
  VENDEDOR = v; ES_ADMIN = esAdmin;
  localStorage.setItem('p593_vendedor', v);
  localStorage.setItem('p593_admin', esAdmin?'1':'0');
  localStorage.setItem('p593_auth','1');
  enterApp();
}
async function enterApp(){
  if(!Object.keys(CONFIG).length) await loadConfig();
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('who').textContent = (ES_ADMIN?'👑 ':'👤 ')+VENDEDOR;
  // Asesores: solo Vender. Admin (Homero): todas las pantallas.
  document.querySelectorAll('.nav button').forEach(b=>{
    const t=b.dataset.tab;
    b.style.display = (!ES_ADMIN && (t==='inventario'||t==='reportes')) ? 'none' : '';
  });
  go('vender');
  actualizarBadgeEnvios();
}
function logout(){ localStorage.removeItem('p593_auth'); location.reload(); }

// ── NAV ──
let TAB='vender';
function go(tab){
  if(!ES_ADMIN && (tab==='inventario'||tab==='reportes')) tab='vender'; // asesor: solo Vender
  TAB=tab;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if(tab==='vender') renderVender();
  if(tab==='envios') renderEnvios();
  if(tab==='inventario') renderInventario();
  if(tab==='reportes') renderReportes();
}

async function loadProductos(){
  const { data } = await db.from('productos').select('*').eq('activo',true).order('nombre');
  productosCache = data||[];
  return productosCache;
}

// ════════════ VENDER ════════════
async function renderVender(){
  const v=document.getElementById('view');
  v.innerHTML='<div class="empty">Cargando…</div>';
  await loadProductos();
  v.innerHTML = `

    <div class="card">
      <div id="wizard"></div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between"><b>🛒 Carrito</b><span class="muted" id="cart-count">0 items</span></div>

      <div class="seg" style="margin-bottom:.8rem">

        <button id="t-drop" onclick="setTipo('dropshipping')">📦 Dropshipping</button>
        <button id="t-cod" onclick="setTipo('contraentrega')">🚚 Contra entrega</button>
      </div>
      <label class="lbl">Datos del cliente <span style="color:var(--soft)">(recomendado)</span></label>

        <input class="fld" id="c-tel" placeholder="Teléfono 09…">
      </div>
      <div class="grid2" style="margin-bottom:.6rem">
        <input class="fld" id="c-cedula" placeholder="Cédula">
        <input class="fld" id="c-ciudad" placeholder="Ciudad">
      </div>
      <div id="drop-fields" style="display:none">
        <label class="lbl">Dirección exacta de envío</label>
        <input class="fld" id="c-direccion" placeholder="Calle, número, referencia…" style="margin-bottom:.7rem">
        <div id="servientrega-fields">
        <div style="margin-bottom:.7rem"><label class="lbl">Zona de envío</label>
          <select class="fld" id="zona" onchange="calcTotales()">
            <option value="guayaquil">Guayaquil ($3.50)</option>
            <option value="provincia">Provincia ($6.50)</option>
          </select>
        </div>
        <label class="lbl">¿Quién paga el envío?</label>
        <div class="seg" style="margin-bottom:.4rem">
          <button id="e-cli" class="on" onclick="setEnvio('cliente')">Cliente paga</button>

        </div>
        <div id="cod-fields" style="display:none">
          <div class="muted" style="font-size:12px;margin-bottom:.6rem">🚚 Envío por <b>Pardux</b> desde Guayaquil. El cliente paga todo al recibir. La comisión cuenta cuando quede <b>entregado y cobrado</b>.</div>
          <label class="lbl">Envío que paga el cliente</label>
          <div class="seg" style="margin-bottom:.4rem">
            ${COD_ENVIOS.map((n,i)=>`<button id="cod-e-${n}" class="${i===0?'on':''}" onclick="setCodEnvio(${n})">$${n}</button>`).join('')}
          </div>
        </div>
      </div>
      <label class="lbl">Descuento (opcional)</label>
      <div class="seg" style="margin-bottom:.5rem">
        <button id="d-no" class="on" onclick="setDesc('no')">Sin desc.</button>
        <button id="d-pct" onclick="setDesc('porcentaje')">% Porcentaje</button>
        <button id="d-fin" onclick="setDesc('monto_final')">$ Precio final</button>
      </div>
      <input class="fld" id="desc-val" type="number" step="0.5" style="display:none;margin-bottom:.6rem" oninput="calcTotales()">
      <div style="margin:.6rem 0" id="pago-wrap"><label class="lbl">Método de pago</label>
        <select class="fld" id="pago"><option>Efectivo</option><option>Transferencia</option><option>Otro</option></select>
      </div>
      <div id="totales"></div>
      <button class="btn btn-green" style="width:100%;margin-top:.8rem;padding:.9rem" id="btn-vender" onclick="registrarVenta()">✅ Registrar venta</button>
    </div>
  `;
  SEL={genero:null,prenda:null,color:null};
  renderWizard();
  renderCart();
}

// ── Asistente guiado de selección: Género → Prenda → Color → Talla ──
let SEL={genero:null,prenda:null,color:null};
const PRENDA_LABEL={camisa_mujer:'Camisa Manga Larga',camisa_hombre:'Camisa Manga Larga',polo_pique:'Polo Piqué RL',polo_lacoste:'Polo Piqué Lacoste',camiseta_rl:'Camiseta Redonda Polo RL',camiseta_lacoste:'Camiseta Redonda Lacoste',camisa_corta_hombre:'Camisa Manga Corta',camisa_lacoste:'Camisa Manga Larga Lacoste'};
const PRENDA_ICON={camisa_mujer:'👔',camisa_hombre:'👔',polo_pique:'🎽',polo_lacoste:'🎽',camiseta_rl:'👕',camiseta_lacoste:'👕',camisa_corta_hombre:'👔',camisa_lacoste:'👔'};
const COLOR_HEX={'Blanco':'#f5f5f5','Negro':'#1a1a1a','Celeste Claro':'#a8d8ea','Celeste claro':'#a8d8ea','Navy':'#1b2a4a','Azul Marino':'#1b2a4a','Rosa Pastel':'#f4c2c2','Rosa pastel':'#f4c2c2','Amarillo':'#f4d03f','Gris Jaspe':'#9e9e9e','Verde Oliva':'#6b7a3a','Rojo Intenso':'#a93226','Café':'#6f4e37','Turquesa':'#40e0d0','Rojo':'#c0392b','Azul Rey':'#1e3a8a','Naranja':'#e67e22','Celeste Cielo':'#87ceeb','Verde Bosque':'#1e7a3a','Verde Agua':'#2dd4bf','Celeste 2':'#b0e0e6','Verde Lima':'#a3e635','Gris Oscuro':'#555555','Verde Menta':'#98e8b0','Celeste Pastel':'#cce7f0'};
// Polo piqué RL de mujer (30 sep 2026): mismo precio, colores y tallas que el de hombre
Object.assign(PRENDA_LABEL,{polo_pique_mujer:'Polo Piqué RL'});

const prodsGenero = g => productosCache.filter(p => p.genero===g || p.genero==='unisex');
function pickGenero(g){ SEL={genero:g,prenda:null,color:null}; renderWizard(); }
function pickPrenda(t){ SEL.prenda=t; SEL.color=null; renderWizard(); }

function pickTalla(sku){ addCart(sku); SEL={genero:SEL.genero,prenda:null,color:null}; toast('✓ Agregado al carrito'); renderWizard(); }
function wizardBack(){ if(SEL.color) SEL.color=null; else if(SEL.prenda) SEL.prenda=null; else SEL.genero=null; renderWizard(); }

function renderWizard(){
  const el=document.getElementById('wizard'); if(!el) return;
  const crumb = `<div class="wz-crumb">${SEL.genero?`<span>${SEL.genero==='mujer'?'👩 Mujer':'👨 Hombre'}</span>`:''}${SEL.prenda?`<span>${prendaLabel(SEL.prenda)}</span>`:''}${SEL.color?`<span>${SEL.color}</span>`:''}${(SEL.genero?`<button class="wz-back" onclick="wizardBack()">‹ Volver</button>`:'')}</div>`;
  let body='';
  if(!SEL.genero){
    body=`<div class="wz-step">¿Para quién es?</div>
      <div class="wz-grid">
        <button class="wz-btn" onclick="pickGenero('mujer')"><span style="font-size:30px">👩</span>Mujer</button>
        <button class="wz-btn" onclick="pickGenero('hombre')"><span style="font-size:30px">👨</span>Hombre</button>
      </div>`;
  } else if(!SEL.prenda){
    const tipos=[...new Set(prodsGenero(SEL.genero).map(p=>p.tipo))];
    body=`<div class="wz-step">¿Qué prenda?</div><div class="wz-grid">${tipos.map(t=>`<button class="wz-btn" onclick="pickPrenda('${t}')"><span style="font-size:26px">${prendaIcon(t)}</span>${prendaLabel(t)}</button>`).join('')}</div>`;
  } else if(!SEL.color){
    const subset=prodsGenero(SEL.genero).filter(p=>p.tipo===SEL.prenda);
    const byColor={}; subset.forEach(p=>{ byColor[p.color]=(byColor[p.color]||0)+p.stock; });
    const colores=Object.keys(byColor).sort((a,b)=>byColor[b]-byColor[a]); // en tienda primero
    body=`<div class="wz-step">¿Qué color?</div><div class="wz-grid" style="grid-template-columns:1fr 1fr 1fr">${colores.map(c=>`<button class="wz-btn" onclick="pickColor('${c.replace(/'/g,"\\'")}')"><span class="wz-swatch" style="background:${COLOR_HEX[c]||'#888'}"></span><span style="font-size:11px">${c}</span><span class="sub" style="color:${byColor[c]>0?'var(--green)':'var(--soft)'}">${byColor[c]>0?'tienda '+byColor[c]:'catálogo'}</span></button>`).join('')}</div>`;
  } else {
    const opts=prodsGenero(SEL.genero).filter(p=>p.tipo===SEL.prenda && p.color===SEL.color).sort((a,b)=>TALLA_ORDER.indexOf(a.talla)-TALLA_ORDER.indexOf(b.talla));
    const precio=opts[0]?(+opts[0].precio_venta>0?money(opts[0].precio_venta):'🏷️ liquidación: el precio se pone en "$ Precio final"'):'';
    body=`<div class="wz-step">¿Qué talla? <span class="muted" style="font-size:13px;font-weight:400">· ${precio}</span></div>
      <div class="wz-grid" style="grid-template-columns:1fr 1fr 1fr 1fr">${opts.map(p=>`<button class="wz-btn" style="min-height:64px" onclick="pickTalla('${p.sku}')"><span style="font-size:22px;font-weight:700">${p.talla}</span><span class="sub">stock ${p.stock}</span></button>`).join('')}</div>`;
  }
  el.innerHTML = crumb + body;
}
function addCart(sku){
  const p=productosCache.find(x=>x.sku===sku);
  if(!p) return;
  const ex=cart.find(c=>c.sku===sku);
  if(ex) ex.cantidad++;
  else cart.push({sku:p.sku, nombre:p.nombre, talla:p.talla, color:p.color, cantidad:1, precio_unit:+p.precio_venta, costo_unit:+p.costo});
  renderCart();
}
function chgQty(sku,d){
  const c=cart.find(x=>x.sku===sku); if(!c) return;
  c.cantidad+=d; if(c.cantidad<=0) cart=cart.filter(x=>x.sku!==sku);
  renderCart();
}
function renderCart(){
  const el=document.getElementById('cart'); if(!el) return;
  document.getElementById('cart-count').textContent = cart.reduce((s,c)=>s+c.cantidad,0)+' items';
  document.getElementById('checkout').style.display = cart.length? 'block':'none';
  el.innerHTML = cart.length===0 ? '<div class="empty">Agrega productos arriba</div>' :
    cart.map(c=>`
      <div class="cart-line">
        <div style="flex:1">
          <div>${c.nombre} · ${c.color||''} · <b>${c.talla||''}</b></div>
          <small class="muted">${c.sku} · ${money(c.precio_unit)} c/u</small>
        </div>
        <div class="qtybox">
          <button onclick="chgQty('${c.sku}',-1)">−</button>
          <span style="min-width:22px;text-align:center">${c.cantidad}</span>
          <button onclick="chgQty('${c.sku}',1)">+</button>
        </div>
        <div style="min-width:60px;text-align:right">${money(c.precio_unit*c.cantidad)}</div>
      </div>`).join('');
  if(cart.length) calcTotales();
}
let TIPO='local', ENVIO_MODO='cliente', DESC_TIPO='no', COD_ENVIO=COD_ENVIOS[0];
function setCodEnvio(n){
  COD_ENVIO=n;
  COD_ENVIOS.forEach(x=>{ const b=document.getElementById('cod-e-'+x); if(b) b.classList.toggle('on',x===n); });
  calcTotales();
}
function setDesc(t){

function setEnvio(m){
  ENVIO_MODO=m;
  document.getElementById('e-cli').classList.toggle('on',m==='cliente');
  document.getElementById('e-free').classList.toggle('on',m==='gratis');
  calcTotales();
}
function calcTotales(){
  const subtotal = cart.reduce((s,c)=>s+c.precio_unit*c.cantidad,0);
  const costo = cart.reduce((s,c)=>s+c.costo_unit*c.cantidad,0);
  let costoEnvio=0, envioCobrado=0;
  if(TIPO==='dropshipping'){
    const zona=document.getElementById('zona').value;
    costoEnvio=ENVIO[zona];
    envioCobrado = ENVIO_MODO==='cliente'? costoEnvio : 0;
  } else if(TIPO==='contraentrega'){
    // El costo real de Pardux se conoce al generar la guía; hasta entonces se asume igual
    // a lo cobrado (neutro) y la ganancia se muestra como estimada.
    envioCobrado = COD_ENVIO; costoEnvio = COD_ENVIO;
  }
  // Descuento: por porcentaje de los productos, o "precio final" = TOTAL que paga el
  // cliente (envío incluido). El precio final siempre se respeta tal cual lo escribe
  // el vendedor; si queda por encima del precio de lista, descuentoMonto sale negativo
  // (un recargo) y la ganancia sube en consecuencia.
  let descuentoMonto=0, descTipo=null, descVal=0;
  const dv = parseFloat((document.getElementById('desc-val')||{}).value)||0;
  if(DESC_TIPO==='porcentaje' && dv>0){ descTipo='porcentaje'; descVal=Math.min(dv,100); descuentoMonto = subtotal*descVal/100; }
  else if(DESC_TIPO==='monto_final' && dv>0){ descTipo='monto_final'; descVal=dv; descuentoMonto = (subtotal+envioCobrado) - dv; }
  descuentoMonto = Math.round(descuentoMonto*100)/100;
  const total = subtotal + envioCobrado - descuentoMonto;
  const ganancia = total - costo - costoEnvio;
  const el=document.getElementById('totales');
  if(el) el.innerHTML = `
    <div class="totline"><span class="muted">Productos</span><span>${money(subtotal)}</span></div>
    ${TIPO==='dropshipping'?`<div class="totline"><span class="muted">Envío cobrado al cliente</span><span>${money(envioCobrado)}</span></div>
      <div class="totline"><span class="muted">Costo de envío (lo pagas tú)</span><span>-${money(costoEnvio)}</span></div>`:''}
    ${TIPO==='contraentrega'?`<div class="totline"><span class="muted">Envío cobrado al cliente</span><span>${money(envioCobrado)}</span></div>
      <div class="totline"><span class="muted">Costo Pardux</span><span class="muted">se registra al cargar la guía</span></div>`:''}
    ${descuentoMonto>0?`<div class="totline"><span class="muted">Descuento ${descTipo==='porcentaje'?'('+descVal+'%)':''}</span><span style="color:var(--red)">-${money(descuentoMonto)}</span></div>`:''}
    ${descuentoMonto<0?`<div class="totline"><span class="muted">Ajuste por precio final</span><span>+${money(-descuentoMonto)}</span></div>`:''}
    <div class="totline big"><span>${TIPO==='contraentrega'?'Total que cobra Pardux al entregar':'Total a cobrar'}</span><span>${money(total)}</span></div>
    ${ES_ADMIN?`<div class="totline"><span class="muted">Tu ganancia${TIPO==='contraentrega'?' (estimada, antes del costo Pardux)':''}</span><span class="gain">${money(ganancia)}</span></div>`:''}`;
  return {subtotal,costo,descuentoMonto,descTipo,descVal,costoEnvio,envioCobrado,total,ganancia};
}
async function registrarVenta(){
  if(!cart.length) return;
  const btn=document.getElementById('btn-vender');
  // Prendas de liquidación vienen con precio 0: sin "precio final" se venderían regaladas
  const precioFinal = parseFloat((document.getElementById('desc-val')||{}).value)||0;
  if(cart.some(c=>!(+c.precio_unit>0)) && !(DESC_TIPO==='monto_final' && precioFinal>0)){
    toast('Hay prendas de liquidación sin precio: escribe el total en "$ Precio final"'); return;
  }
  btn.disabled=true; btn.textContent='Guardando…';
  const t=calcTotales();
  const esCOD = TIPO==='contraentrega';
  const conEnvio = TIPO==='dropshipping' || esCOD;
  const zona = TIPO==='dropshipping'? document.getElementById('zona').value : (esCOD ? 'pardux' : null);
  const ciudad = document.getElementById('c-ciudad').value||null;
  const direccion = conEnvio ? (document.getElementById('c-direccion').value||null) : null;
  const telefono = document.getElementById('c-tel').value||null;
  const cedula = document.getElementById('c-cedula').value||null;
  // Dropshipping y contra entrega necesitan destino + teléfono (para el courier y el CRM)
  if(conEnvio && (!ciudad || !direccion || !telefono)){
    toast((esCOD?'Contra entrega':'Dropshipping')+' necesita teléfono, ciudad y dirección'); btn.disabled=false; btn.textContent='✅ Registrar venta'; return;
  }
  const venta = {
    tipo:TIPO, vendedor:VENDEDOR,
    cliente_nombre: document.getElementById('c-nombre').value||null,
    cliente_telefono: telefono, cedula,
    ciudad, zona_envio:zona, costo_envio:t.costoEnvio, envio_cobrado:t.envioCobrado,
    descuento_tipo:t.descTipo, descuento_valor:t.descVal, descuento_monto:t.descuentoMonto,
    subtotal:t.subtotal, total:t.total, costo_productos:t.costo, ganancia:t.ganancia,
    metodo_pago: esCOD ? 'Contra entrega' : document.getElementById('pago').value,
    notas: direccion  // guardamos la dirección exacta aquí
  };
  if(esCOD){ venta.estado_envio='por_despachar'; venta.estado_envio_at=new Date().toISOString(); }
  const { data:vRow, error } = await db.from('ventas').insert(venta).select().single();
  if(error){ toast('Error: '+error.message); btn.disabled=false; btn.textContent='✅ Registrar venta'; return; }
  const esLocal = TIPO==='local';
  const items = cart.map(c=>({venta_id:vRow.id, sku:c.sku, nombre:c.nombre, talla:c.talla, cantidad:c.cantidad, precio_unit:c.precio_unit, costo_unit:c.costo_unit, es_local:esLocal}));
  await db.from('venta_items').insert(items);
  // datos para compartir (incluyen COLOR, que no se guarda en venta_items)
  const shareItems = cart.map(c=>({nombre:c.nombre, color:c.color, talla:c.talla, cantidad:c.cantidad, precio_unit:c.precio_unit, costo_unit:c.costo_unit}));
  venta.direccion = direccion;
  const folio = vRow.folio;
  await sincronizarCRM(venta, shareItems, folio);
  cart=[]; TIPO='local'; ENVIO_MODO='cliente'; DESC_TIPO='no'; COD_ENVIO=COD_ENVIOS[0];
  if(esCOD) actualizarBadgeEnvios();
  // Asesor → pantalla para compartir a Homero. Admin → solo confirma.
  if(!ES_ADMIN) mostrarCompartir(folio, venta, shareItems);
  else { toast('✅ Venta #'+folio+' registrada'); renderVender(); }
}
// Alimenta el CRM (mismo Supabase que usa crm-dashboard.html): cada venta de esta
// app también queda como pedido en el CRM, para tener una sola fuente de verdad
// entre las ventas web y los pedidos que llegan por conversación de WhatsApp.
async function sincronizarCRM(venta, items, folio){
  const phone = (venta.cliente_telefono||'').replace(/\D/g,'');
  // Contra entrega todavía no está cobrada: queda "pendiente" hasta que Pardux entregue.
  const statusCRM = venta.tipo==='local' ? 'entregado' : venta.tipo==='contraentrega' ? 'pendiente' : 'pagado';
  const statusCliente = statusCRM==='pendiente' ? 'pedido_pendiente' : statusCRM;
  if(phone){
    try{
      await db.from('clientes').upsert({
        phone, name: venta.cliente_nombre||'Cliente', city: venta.ciudad||null,
        status: statusCliente, source: 'ventas-app', last_contact: new Date().toISOString()
      }, { onConflict: 'phone' });
    }catch(e){ /* no bloquea el registro de la venta */ }
  }
  const corto = n => (n||'').replace('Camisa Manga Larga Polo Ralph Lauren','Camisa').replace('Cuello Redondo','Redonda');
  const itemsPedido = items.map(i=>({ nombre:(i.cantidad>1?i.cantidad+'x ':'')+corto(i.nombre), color:i.color||'', talla:i.talla||'', precio:i.precio_unit }));
  const notas = [
    `Venta #${folio} · ${venta.tipo==='local'?'🏬 Local':venta.tipo==='contraentrega'?'🚚 Contra entrega (Pardux)':'📦 Dropshipping'} · Vendedor: ${venta.vendedor}`,
    venta.cedula ? `CI: ${venta.cedula}` : null,
    venta.direccion ? `Dirección: ${venta.direccion}` : null,
    venta.descuento_monto>0 ? `Descuento aplicado: -${money(venta.descuento_monto)}` : null,
    venta.descuento_monto<0 ? `Ajuste por precio final: +${money(-venta.descuento_monto)}` : null
  ].filter(Boolean).join(' — ');
  try{
    await db.from('pedidos').insert({
      cliente_phone: phone||null, cliente_name: venta.cliente_nombre||null, ciudad: venta.ciudad||null,
      items: itemsPedido, total: venta.total, status: statusCRM, asesor: venta.vendedor, notes: notas
    });
  }catch(e){ /* no bloquea el registro de la venta */ }
}
// Link wa.me que abre la conversación con Homero y el mensaje ya escrito.
// OJO: el texto lo ve el asesor, por eso NO incluye la ganancia.
function waLink(venta, items, folio){
  const num = (CONFIG.whatsapp_admin||'593983209216').replace(/\D/g,'');
  const corto = n => (n||'').replace('Camisa Manga Larga Polo Ralph Lauren','Camisa').replace('Cuello Redondo','Redonda');
  const prenda = i => `• ${i.cantidad}x ${corto(i.nombre)} ${i.color||''} ${i.talla||''}`.replace(/ +/g,' ').trim();
  let msg;
  if(venta.tipo==='contraentrega'){
    // Pedido a la proveedora de Guayaquil, despachado por Pardux con cobro al cliente
    const lineas = items.map(prenda).join('\n');
    const costoP = items.reduce((s,i)=>s+(+i.costo_unit||0)*i.cantidad,0);
    msg = `🚚 PEDIDO CONTRA ENTREGA #${folio} (Pardux)\n👤 Vendedor: ${VENDEDOR}\n\n${lineas}\n\n💵 A pagar a proveedora: ${money(costoP)} (prendas)\n💰 *Pardux cobra al cliente: ${money(venta.total)}*\n\n📍 Ciudad: ${venta.ciudad||'—'}\n🏠 Dirección: ${venta.direccion||'—'}${venta.cliente_telefono?'\n📞 '+venta.cliente_telefono:''}${venta.cliente_nombre?'\n🧍 '+venta.cliente_nombre:''}${venta.cedula?'\n🪪 CI: '+venta.cedula:''}`;
  } else if(venta.tipo==='dropshipping'){
    // Pedido para la proveedora: SIN precios de venta, con costo a pagar + envío + destino
    const lineas = items.map(prenda).join('\n');
    const costoP = items.reduce((s,i)=>s+(+i.costo_unit||0)*i.cantidad,0);
    const env = +venta.costo_envio||0;
    msg = `📦 PEDIDO DROPSHIPPING #${folio}\n👤 Vendedor: ${VENDEDOR}\n\n${lineas}\n\n💵 *A pagar a proveedora: ${money(costoP+env)}*\n   Prendas ${money(costoP)} + Envío ${money(env)}\n\n📍 Ciudad: ${venta.ciudad||'—'}\n🏠 Dirección: ${venta.direccion||'—'}${venta.cliente_telefono?'\n📞 '+venta.cliente_telefono:''}${venta.cliente_nombre?'\n🧍 '+venta.cliente_nombre:''}${venta.cedula?'\n🪪 CI: '+venta.cedula:''}`;
  } else {
    const lineas = items.map(i=>`${prenda(i)} (${money(i.precio_unit)})`).join('\n');
    const cli = [venta.cliente_nombre, venta.cedula, venta.cliente_telefono, venta.ciudad].filter(Boolean).join(' · ');
    const cliLine = cli ? `\n🧍 Cliente: ${cli}` : '';
    const desc = (venta.descuento_monto>0) ? `\n🏷️ Descuento: -${money(venta.descuento_monto)}`
               : (venta.descuento_monto<0) ? `\n🏷️ Ajuste por precio final: +${money(-venta.descuento_monto)}` : '';
    msg = `🧾 NUEVA VENTA #${folio}\n🏬 LOCAL${cliLine}\n👤 Vendedor: ${VENDEDOR}\n\n${lineas}${desc}\n\n💰 Total: ${money(venta.total)}\n💳 ${venta.metodo_pago||''}`;
  }
  return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}
function mostrarCompartir(folio, venta, items){
  document.getElementById('view').innerHTML = `
    <div class="card" style="text-align:center;margin-top:1.5rem">
      <div style="font-size:52px">✅</div>
      <h2 class="page" style="margin:.4rem 0">Venta #${folio} registrada</h2>
      <p class="muted" style="margin-bottom:1.3rem">Toca para compartir el detalle a Homero — se abrirá tu WhatsApp con el mensaje listo</p>
      <a class="btn btn-green" style="display:block;padding:1rem;text-decoration:none;font-size:16px" href="${waLink(venta,items,folio)}" target="_blank" rel="noopener">📲 Compartir a WhatsApp</a>
      <button class="btn btn-ghost" style="width:100%;margin-top:.8rem;padding:.85rem" onclick="renderVender()">➕ Registrar otra venta</button>

}

// ════════════ ENVÍOS — contra entrega (Pardux) ════════════
// Flujo: por_despachar → en_camino (guía + link de Pardux) → entregado (cobrado) → depositado.
// Si el cliente no recibe: rechazado → la venta queda anulada (no suma ingresos ni comisión).
let ENV_FILTRO='activos';
const ENV_ACTIVOS=['por_despachar','en_camino','entregado'];
async function actualizarBadgeEnvios(){
  const b=document.getElementById('nav-envios'); if(!b) return;
  const { data, error } = await db.from('ventas').select('id').eq('tipo','contraentrega').in('estado_envio',['por_despachar','en_camino']);
  const n = error ? 0 : (data||[]).length;
  b.textContent = n; b.style.display = n>0 ? '' : 'none';
}
function envFiltro(f){ ENV_FILTRO=f; renderEnvios(); }
async function renderEnvios(){

// Busca el pedido del CRM que corresponde a una venta (se crea con notes "Venta #N · …")
async function pedidoDeVenta(folio){
  const { data } = await db.from('pedidos').select('id,notes,cliente_phone,status').like('notes',`Venta #${folio} ·%`).limit(1);
  return (data||[])[0]||null;
}
async function guardarGuiaEnvio(id){
  const x=(window._envCache||[]).find(v=>v.id===id); if(!x) return;
  const guia=(document.getElementById('guia-'+id).value||'').trim();
  const link=(document.getElementById('link-'+id).value||'').trim();
  const costoTxt=(document.getElementById('costo-'+id).value||'').trim();
  if(!guia){ toast('Escribe el número de guía de Pardux'); return; }
  if(link && !/^https?:\/\//i.test(link)){ toast('El link debe empezar con https://'); return; }
  const upd={ guia_envio:guia, tracking_url:link||null, estado_envio_at:new Date().toISOString() };
  if(x.estado_envio==='por_despachar') upd.estado_envio='en_camino';
  if(costoTxt!==''){
    const c=parseFloat(costoTxt);
    if(isNaN(c)||c<0){ toast('Costo Pardux inválido'); return; }
    upd.costo_envio=c;
    upd.ganancia=Math.round(((+x.total)-(+x.costo_productos)-c)*100)/100;
  }
  const { error } = await db.from('ventas').update(upd).eq('id',id);
  if(error){ toast('Error: '+error.message); return; }
  // Reflejar en el CRM: guía + estado enviado + link en las notas
  const p=await pedidoDeVenta(x.folio);
  if(p){
    let notes=(p.notes||'').replace(/ — Seguimiento Pardux: \S+/,'');
    if(link) notes+=` — Seguimiento Pardux: ${link}`;
    await db.from('pedidos').update({ guia_servientrega:guia, status: p.status==='entregado'?'entregado':'enviado', notes, updated_at:new Date().toISOString() }).eq('id',p.id);
  }
  toast(upd.estado_envio==='en_camino'?'🚚 Pedido en camino':'✓ Guía actualizada');
  renderEnvios();
}
async function cambiarEstadoEnvio(id, nuevo){
  const x=(window._envCache||[]).find(v=>v.id===id); if(!x) return;
  if(nuevo==='rechazado' && !confirm(`¿Marcar la venta #${x.folio} como RECHAZADA?\nLa venta queda anulada: no suma ingresos ni comisión.`)) return;
  if(nuevo==='depositado' && !confirm(`¿Confirmas que Pardux ya depositó ${money(x.total)} de la venta #${x.folio}?`)) return;
  const upd={ estado_envio:nuevo, estado_envio_at:new Date().toISOString() };
  if(nuevo==='rechazado') upd.anulada=true;
  if(x.estado_envio==='rechazado' && nuevo!=='rechazado') upd.anulada=false;   // reabrir
  const { error } = await db.from('ventas').update(upd).eq('id',id);
  if(error){ toast('Error: '+error.message); return; }
  const p=await pedidoDeVenta(x.folio);
  if(p){
    const stPed = nuevo==='rechazado'?'cancelado' : (nuevo==='entregado'||nuevo==='depositado')?'entregado' : 'enviado';
    const stCli = {cancelado:'perdido', entregado:'entregado', enviado:'pedido_pendiente'}[stPed];
    await db.from('pedidos').update({ status:stPed, updated_at:new Date().toISOString() }).eq('id',p.id);
    if(p.cliente_phone) await db.from('clientes').update({ status:stCli }).eq('phone',p.cliente_phone);
  }
  toast({entregado:'✅ Entregado y cobrado', depositado:'💰 Marcado como depositado', rechazado:'↩️ Venta anulada por rechazo', en_camino:'↺ Reabierto'}[nuevo]||'✓');
  renderEnvios();
}

let REP_DESDE=null, REP_HASTA=null, REP_LABEL='Hoy';
function rangoPreset(p){
  const now=new Date(); const d0=new Date(); d0.setHours(0,0,0,0);
  if(p==='hoy'){ REP_DESDE=d0; REP_HASTA=now; REP_LABEL='Hoy'; }
  else if(p==='ayer'){ const a=new Date(d0); a.setDate(a.getDate()-1); REP_DESDE=a; REP_HASTA=new Date(d0.getTime()-1); REP_LABEL='Ayer'; }
  else if(p==='7'){ const a=new Date(d0); a.setDate(a.getDate()-6); REP_DESDE=a; REP_HASTA=now; REP_LABEL='Últimos 7 días'; }
  else if(p==='30'){ const a=new Date(d0); a.setDate(a.getDate()-29); REP_DESDE=a; REP_HASTA=now; REP_LABEL='Últimos 30 días'; }
  else if(p==='mes'){ REP_DESDE=new Date(now.getFullYear(),now.getMonth(),1); REP_HASTA=now; REP_LABEL='Este mes'; }
  renderReportes();
}

      <div class="totline big"><span>Ingresos netos</span><span>${money(ingresos-devMonto)}</span></div>
      <div style="margin-top:.6rem;border-top:1px solid var(--border);padding-top:.4rem">
      ${devs.map(d=>`<div style="font-size:12px;padding:.3rem 0;border-bottom:1px solid var(--border)">
        <b>Venta #${d.venta_folio}</b> · ${new Date(d.fecha).toLocaleDateString('es-EC',{day:'numeric',month:'short'})} · ${d.vendedor||''} <span style="color:var(--red)">-${money(d.monto)}</span>
        <div class="muted">${(Array.isArray(d.items)?d.items:[]).map(i=>`${i.cantidad}x ${corto(i.nombre)} ${i.talla||''}`).join(', ')}${d.motivo?' · '+d.motivo:''}${d.repuso_stock?' · ↩ stock repuesto':''}</div>
      </div>`).join('')}
      </div>
    </div>` : ''}
    <div class="card">
      <b>Ventas día a día</b>
      <div style="margin-top:.6rem">
      ${dias.length===0?'<div class="empty">Sin ventas en este rango</div>':dias.map(([d,o])=>`
        <div class="bar-row"><span style="width:54px">${d.slice(5)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${o.ing/maxIng*100}%"></div></div>
          <span style="width:62px;text-align:right">${money(o.ing)}</span>
          <span class="gain" style="width:58px;text-align:right">+${money(o.gan)}</span>
        </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <b>Por vendedor</b>
      <table style="margin-top:.5rem"><tbody>
      ${Object.entries(porVend).map(([k,o])=>`<tr><td>${k}</td><td>${o.n} ventas</td><td style="text-align:right" class="gain">${money(o.gan)}</td></tr>`).join('')||'<tr><td class="empty">—</td></tr>'}
      </tbody></table>
    </div>
    <div class="card">
      <b>💵 Comisiones a pagar</b> <span class="muted" style="font-size:12px">— $${COM_DROP.toFixed(0)}/prenda dropship · $${COM_LOCAL.toFixed(0)}/prenda local · $${COM_COD.toFixed(0)}/prenda contra entrega (al entregarse y cobrarse) — no aplica a Homero</span>
      ${comList.length===0?'<div class="empty">Sin comisiones en este rango</div>':`
      <table style="margin-top:.5rem"><thead><tr><th>Vendedor</th><th>Prendas</th><th style="text-align:right">A pagar</th></tr></thead><tbody>

          <div class="bar-track" style="max-width:90px"><div class="bar-fill" style="width:${o.qty/maxQty*100}%"></div></div>

        </div>`).join('')}
      </div>
      ${topTalla.length?`<div style="margin-top:.7rem;font-size:12px;color:var(--soft)">Tallas más vendidas: ${topTalla.map(([t,n])=>`<b style="color:var(--text)">${t}</b> ${n}`).join(' · ')}</div>`:''}
    </div>
    <div class="card">
      <b>Ventas del rango</b> <span class="muted" style="font-size:12px">— toca una para ver el detalle</span>
      <table style="margin-top:.5rem"><thead><tr><th>#</th><th>Tipo</th><th>Vendedor</th><th>Total</th><th>Gan.</th></tr></thead><tbody>
      ${ventas.slice(0,40).map(x=>`<tr onclick="verVenta('${x.id}')" style="cursor:pointer">
        <td>${x.folio}</td>
        <td><span class="badge ${TIPO_BADGE(x.tipo)[0]}">${TIPO_BADGE(x.tipo)[2]}</span>${x.tipo==='contraentrega'&&!COD_COBRADO(x)?' <small class="muted">en tránsito</small>':''}</td>
        <td>${x.vendedor||'—'}</td>
        <td>${money(x.total)}</td>
        <td class="gain">${money(x.ganancia)}</td>
      </tr>`).join('')||'<tr><td colspan=5 class="empty">Sin ventas</td></tr>'}
      </tbody></table>
    </div>
  `;
}
// Comisiones agrupadas por mes calendario, TODO el histórico (no depende del filtro de fecha de arriba).
// Sirve para saber cuánto pagarle a cada vendedor mes a mes.
async function comisionesPorMesHTML(COM_LOCAL,COM_DROP){
  const { data:all } = await db.from('ventas').select('*').eq('anulada',false);
  const noAdmin=(all||[]).filter(v=>!ADMIN_NAMES.includes(v.vendedor));
  const ids=noAdmin.map(v=>v.id);
  let items=[];
  if(ids.length){ const {data:it}=await db.from('venta_items').select('venta_id,cantidad').in('venta_id',ids); items=it||[]; }
  const unitsByVenta={}; items.forEach(i=>{ unitsByVenta[i.venta_id]=(unitsByVenta[i.venta_id]||0)+i.cantidad; });
  const porMes={};
  noAdmin.forEach(v=>{
    const mes=v.fecha.slice(0,7);
    const units=unitsByVenta[v.id]||0;
    const com=(v.comision_ajustada!=null)?+v.comision_ajustada:units*tarifaCom(v);
    porMes[mes]=porMes[mes]||{};
    porMes[mes][v.vendedor]=(porMes[mes][v.vendedor]||0)+com;
  });
  const meses=Object.keys(porMes).sort().reverse();
  if(meses.length===0) return '<div class="empty">Aún no hay comisiones registradas</div>';
  const nombreMes = m => { const [y,mm]=m.split('-'); return new Date(+y,+mm-1,1).toLocaleDateString('es-EC',{month:'long',year:'numeric'}); };
  return meses.map(m=>{
    const vend=Object.entries(porMes[m]).sort((a,b)=>b[1]-a[1]);
    const totalMes=vend.reduce((s,e)=>s+e[1],0);
    return `<div style="margin-bottom:1rem">
      <div style="display:flex;justify-content:space-between;font-weight:600;text-transform:capitalize;margin-bottom:.3rem">
        <span>${nombreMes(m)}</span><span style="color:var(--gold)">${money(totalMes)}</span>
      </div>
      <table><tbody>
      ${vend.map(([k,val])=>`<tr><td>${k}</td><td style="text-align:right;color:var(--gold)">${money(val)}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
  }).join('');
}

// ── Admin: eliminar venta (repone stock automático si era local) ──
async function eliminarVenta(id){
  if(!confirm('¿Eliminar esta venta? No se puede deshacer.\nSi era venta LOCAL, el stock de esas prendas se repone automáticamente.')) return;
  const { error } = await db.from('ventas').delete().eq('id', id);
  if(error){ toast('Error: '+error.message); return; }
  toast('✓ Venta eliminada');
  closeModal();
  renderReportes();
}

// ── Admin: ajustar manualmente la comisión de una venta puntual ──
async function guardarComision(id){
  const val = parseFloat(document.getElementById('com-edit').value);
  if(isNaN(val) || val<0){ toast('Monto inválido'); return; }
  const { error } = await db.from('ventas').update({ comision_ajustada: val }).eq('id', id);
  if(error){ toast('Error: '+error.message); return; }
  toast('✓ Comisión ajustada a '+money(val));
  closeModal();
  renderReportes();
}

function verVenta(id){
  const v=(window._ventasCache||[]).find(x=>x.id===id); if(!v) return;
  const its=(window._itemsByVenta||{})[id]||[];
  const cli=[v.cliente_nombre,v.cedula&&('CI '+v.cedula),v.cliente_telefono,v.ciudad].filter(Boolean).join(' · ');
  const fecha=new Date(v.fecha).toLocaleString('es-EC',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  const html=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem">
      <h3 style="font-size:17px">Venta #${v.folio}</h3>
      <button onclick="closeModal()" class="btn btn-ghost" style="padding:.3rem .7rem">✕</button>
    </div>
    <div class="muted" style="font-size:12px;margin-bottom:.7rem">${fecha} · <span class="badge ${TIPO_BADGE(v.tipo)[0]}">${TIPO_BADGE(v.tipo)[1]}</span> · ${v.vendedor||''}</div>
    ${cli?`<div style="font-size:13px;margin-bottom:.3rem">🧍 <b>Cliente:</b> ${cli}</div>`:''}
    ${v.tipo!=='local'&&v.notas?`<div style="font-size:13px;margin-bottom:.6rem">🏠 <b>Dirección:</b> ${v.notas}</div>`:''}
    ${v.tipo==='contraentrega'?`<div style="font-size:13px;margin-bottom:.6rem">🚚 <b>Pardux:</b> ${(EST_ENVIO[v.estado_envio]||EST_ENVIO.por_despachar).txt}${v.guia_envio?` · guía <b>${v.guia_envio}</b>`:''}${v.tracking_url?` · <a href="${v.tracking_url}" target="_blank" rel="noopener" style="color:var(--gold)">seguimiento ↗</a>`:''}</div>`:''}
    <div style="border-top:1px solid var(--border);padding-top:.5rem">
    ${its.map(i=>`<div class="totline"><span>${i.cantidad}x ${i.nombre.replace('Camisa Manga Larga Polo Ralph Lauren','Camisa').replace('Cuello Redondo','Redonda')} ${i.talla||''}</span><span>${money(i.precio_unit*i.cantidad)}</span></div>`).join('')||'<div class="muted">Sin items</div>'}
    </div>
    ${v.descuento_monto>0?`<div class="totline" style="color:var(--red)"><span>Descuento</span><span>-${money(v.descuento_monto)}</span></div>`:''}
    ${v.descuento_monto<0?`<div class="totline"><span>Ajuste por precio final</span><span>+${money(-v.descuento_monto)}</span></div>`:''}
    ${v.tipo!=='local'?`<div class="totline"><span class="muted">Envío</span><span>${money(v.envio_cobrado)}</span></div>`:''}
    <div class="totline big"><span>Total</span><span>${money(v.total)}</span></div>
    ${ES_ADMIN?`<div class="totline"><span class="muted">Ganancia</span><span class="gain">${money(v.ganancia)}</span></div>`:''}
    ${(()=>{
      if(ADMIN_NAMES.includes(v.vendedor)) return '';
      const u=its.reduce((s,i)=>s+i.cantidad,0);
      const comCalc=u*tarifaCom(v);
      const comActual=v.comision_ajustada!=null?+v.comision_ajustada:comCalc;
      if(!ES_ADMIN) return comActual>0?`<div class="totline"><span class="muted">Comisión ${v.vendedor}</span><span style="color:var(--gold)">${money(comActual)}</span></div>`:'';
      return `<div class="totline"><span class="muted">Comisión ${v.vendedor}${v.comision_ajustada!=null?' (ajustada)':' (calculada: '+money(comCalc)+')'}</span><span style="color:var(--gold);font-weight:600">${money(comActual)}</span></div>
        <div class="row" style="margin-top:.4rem">
          <input class="fld" id="com-edit" type="number" step="0.5" value="${comActual.toFixed(2)}" style="flex:1">
          <button class="btn btn-gold" onclick="guardarComision('${id}')">Guardar</button>
        </div>`;
    })()}
    <div class="muted" style="font-size:12px;margin-top:.5rem">💳 ${v.metodo_pago||''}</div>
    ${ES_ADMIN?`<button class="btn btn-ghost" style="width:100%;margin-top:1rem;padding:.7rem" onclick="abrirDevolucion('${id}')">↩️ Registrar devolución</button>`:''}
    ${ES_ADMIN?`<button class="btn btn-red" style="width:100%;margin-top:.6rem;padding:.7rem" onclick="eliminarVenta('${id}')">🗑 Eliminar venta</button>`:''}`;
  showModal(html);
}
function showModal(html){ document.getElementById('modal-box').innerHTML=html; document.getElementById('modal').classList.add('open'); }
function closeModal(){ document.getElementById('modal').classList.remove('open'); }

// ════════════ DEVOLUCIONES (admin) ════════════
// Formulario: elegir qué prendas y cuántas devolver de una venta.
function abrirDevolucion(ventaId){
  const v=(window._ventasCache||[]).find(x=>x.id===ventaId); if(!v) return;
  const its=(window._itemsByVenta||{})[ventaId]||[];
  const corto=n=>(n||'').replace('Camisa Manga Larga Polo Ralph Lauren','Camisa').replace('Cuello Redondo','Redonda');
  const filas=its.map((i,idx)=>`
    <div class="totline" style="align-items:center">
      <span style="flex:1">${corto(i.nombre)} ${i.talla||''} <span class="muted">(${i.cantidad} vend · ${money(i.precio_unit)})</span></span>
      <div class="qtybox">
        <button onclick="devQ(${idx},-1,${i.cantidad})">−</button>
        <span id="devq-${idx}" data-q="0" data-precio="${i.precio_unit}" data-sku="${i.sku}" data-max="${i.cantidad}" style="min-width:22px;text-align:center">0</span>
        <button onclick="devQ(${idx},1,${i.cantidad})">+</button>
      </div>
    </div>`).join('');
  const html=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem">
      <h3 style="font-size:17px">↩️ Devolución — Venta #${v.folio}</h3>
      <button onclick="verVenta('${ventaId}')" class="btn btn-ghost" style="padding:.3rem .7rem">✕</button>
    </div>
    <p class="muted" style="font-size:12px;margin-bottom:.7rem">Elige cuántas prendas devuelve el cliente. ${v.tipo==='local'?'Se repone el stock de tienda automáticamente.':'(Dropshipping: no afecta el stock de tienda.)'}</p>
    <div style="border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:.4rem 0;margin-bottom:.7rem">${filas}</div>
    <label class="lbl">Monto a devolver al cliente</label>
    <input class="fld" id="dev-monto" type="number" step="0.5" value="0.00" style="margin-bottom:.7rem">
    <label class="lbl">Motivo</label>
    <input class="fld" id="dev-motivo" placeholder="Ej: talla equivocada, defecto…" style="margin-bottom:.9rem">
    <button class="btn btn-green" style="width:100%;padding:.8rem" onclick="guardarDevolucion('${ventaId}')">Confirmar devolución</button>`;
  showModal(html);
}
function devQ(idx,d,max){
  const el=document.getElementById('devq-'+idx);
  let q=(+el.dataset.q)+d; if(q<0)q=0; if(q>max)q=max;
  el.dataset.q=q; el.textContent=q;
  // recalcular monto sugerido = suma prendas devueltas a precio unitario
  let m=0; document.querySelectorAll('[id^="devq-"]').forEach(s=>{ m+=(+s.dataset.q)*(+s.dataset.precio); });
  document.getElementById('dev-monto').value=m.toFixed(2);
}
async function guardarDevolucion(ventaId){
  const v=(window._ventasCache||[]).find(x=>x.id===ventaId); if(!v) return;
  const items=[];
  document.querySelectorAll('[id^="devq-"]').forEach(s=>{
    const q=+s.dataset.q; if(q>0) items.push({ sku:s.dataset.sku, cantidad:q, precio_unit:+s.dataset.precio });
  });
  if(items.length===0){ toast('Elige al menos 1 prenda a devolver'); return; }
  const monto=parseFloat(document.getElementById('dev-monto').value)||0;
  const motivo=document.getElementById('dev-motivo').value||null;
  // nombres para el registro
  const its=(window._itemsByVenta||{})[ventaId]||[];
  items.forEach(it=>{ const src=its.find(x=>x.sku===it.sku); if(src){ it.nombre=src.nombre; it.talla=src.talla; it.costo_unit=src.costo_unit; }});
  const repuso = v.tipo==='local';
  const { error } = await db.from('devoluciones').insert({
    venta_id:ventaId, venta_folio:v.folio, vendedor:v.vendedor, cliente_nombre:v.cliente_nombre,
    tipo:v.tipo, items, monto, repuso_stock:repuso, motivo
  });
  if(error){ toast('Error: '+error.message); return; }
  // reponer stock si fue venta local (el producto vuelve a la tienda)
  if(repuso){
    for(const it of items){
      const { data:p } = await db.from('productos').select('stock').eq('sku',it.sku).single();
      if(p) await db.from('productos').update({ stock:(p.stock||0)+it.cantidad }).eq('sku',it.sku);
    }
  }
  toast('✓ Devolución registrada'+(repuso?' · stock repuesto':''));
  closeModal();
  renderReportes();
}
