<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polos593 — Ventas & Stock</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:#2e2e2e;
  --text:#f0ede8;--soft:#8a8a8a;--gold:#c9a84c;--green:#22c55e;--red:#ef4444;
  --yellow:#eab308;--blue:#3b82f6;--pink:#ec4899;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

/* Login */
#login{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:1000;padding:1.5rem}
#login h1{color:var(--gold);font-size:22px}
#login input,#login select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:.8rem 1rem;border-radius:10px;font-size:16px;width:260px;outline:none;text-align:center}
#login button{background:var(--gold);color:#000;border:none;padding:.8rem 1rem;border-radius:10px;font-weight:600;width:260px;font-size:16px}
.login-err{color:var(--red);font-size:13px;min-height:18px}

/* App shell */
#app{display:none;min-height:100vh;padding-bottom:70px}
.topbar{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:.8rem 1rem;display:flex;align-items:center;justify-content:space-between;z-index:50}
.topbar .brand{font-weight:700;color:var(--gold)}
.topbar .who{font-size:12px;color:var(--soft)}
.main{padding:1rem;max-width:900px;margin:0 auto}

/* Bottom nav (mobile-first) */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:50}
.nav button{flex:1;min-width:0;background:none;border:none;color:var(--soft);padding:.6rem .1rem;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:.2rem;white-space:nowrap}
.nav button.active{color:var(--gold)}
.nav button svg{width:22px;height:22px}

/* Cards / general */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:1rem}
h2.page{font-size:18px;font-weight:600;margin-bottom:1rem}
.muted{color:var(--soft)}
.row{display:flex;gap:.6rem;align-items:center}
.btn{padding:.6rem 1rem;border-radius:9px;border:none;font-weight:600;font-size:14px}
.btn-gold{background:var(--gold);color:#000}
.btn-green{background:var(--green);color:#000}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-red{background:var(--red);color:#fff}
.btn:disabled{opacity:.5}
input.fld,select.fld{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:.6rem .7rem;border-radius:8px;font-size:14px;width:100%;outline:none}
input.fld:focus,select.fld:focus{border-color:var(--gold)}
label.lbl{font-size:12px;color:var(--soft);display:block;margin-bottom:.25rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.badge{display:inline-block;padding:.15rem .5rem;border-radius:20px;font-size:11px;font-weight:600}
.b-local{background:rgba(59,130,246,.15);color:var(--blue)}
.b-drop{background:rgba(236,72,153,.15);color:var(--pink)}
.b-cod{background:rgba(234,179,8,.15);color:var(--yellow)}
.nav-count{background:var(--red);color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:0 .35rem;margin-left:.2rem}
.env-card{border-left:3px solid var(--border)}
.env-card.st-por_despachar{border-left-color:var(--yellow)}
.env-card.st-en_camino{border-left-color:var(--blue)}
.env-card.st-entregado{border-left-color:var(--green)}
.env-card.st-depositado{border-left-color:var(--gold)}
.env-card.st-rechazado{border-left-color:var(--red);opacity:.7}
.b-low{background:rgba(239,68,68,.18);color:var(--red)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:.7rem 1.2rem;border-radius:10px;font-weight:600;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}

/* Asistente guiado de venta */
.wz-step{font-size:16px;font-weight:600;margin-bottom:.5rem}
.wz-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.wz-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:.9rem .5rem;font-size:14px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;min-height:74px;text-align:center;line-height:1.2}
.wz-btn:active{border-color:var(--gold);background:#2c2c2c}
.wz-btn .sub{font-size:11px;color:var(--soft);font-weight:400}
.wz-swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--border)}
.wz-foto{width:100%;aspect-ratio:3/4;border-radius:8px;overflow:hidden;border:1px solid var(--border);display:block}
.wz-foto img{width:100%;height:100%;object-fit:cover;display:block}
.wz-btn.con-foto{padding:.4rem .4rem .55rem;justify-content:flex-start}
.wz-sec{font-size:12px;font-weight:600;color:var(--soft);margin:.9rem 0 .4rem;text-transform:uppercase;letter-spacing:.04em}
.wz-sec.ok{color:var(--green)}
.wz-confirma{display:flex;gap:.7rem;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:.5rem;margin-bottom:.7rem}
.wz-confirma .wz-foto{width:92px;flex:none}
.cart-thumb{width:38px;height:50px;border-radius:6px;overflow:hidden;flex:none;border:1px solid var(--border);margin-right:.55rem}
.cart-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.sin-stock-item{display:flex;gap:.7rem;align-items:center;margin:.6rem 0}
.sin-stock-item .wz-foto{width:70px;flex:none}
.alt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin:.4rem 0 .8rem}
.alt-grid button{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:.3rem;font-size:10px;cursor:pointer;line-height:1.2}
.wz-crumb{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.7rem}
.wz-crumb span{background:rgba(201,168,76,.12);color:var(--gold);padding:.22rem .6rem;border-radius:20px;font-size:12px;font-weight:600}
.wz-back{background:none;border:none;color:var(--soft);font-size:13px;cursor:pointer;margin-left:auto;padding:.2rem .4rem}

/* Vender: buscador y carrito */
.prod-pick{display:flex;justify-content:space-between;align-items:center;padding:.55rem .3rem;border-bottom:1px solid var(--border);gap:.5rem}
.prod-pick small{color:var(--soft)}
.pick-add{background:var(--gold);color:#000;border:none;border-radius:7px;width:34px;height:34px;font-size:20px;font-weight:700;flex-shrink:0}
.cart-line{display:flex;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px solid var(--border)}
.qtybox{display:flex;align-items:center;gap:.3rem}
.qtybox button{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:16px;font-weight:700}
.seg{display:flex;gap:.4rem}
.seg button{flex:1;padding:.6rem;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:var(--soft);font-weight:600}
.seg button.on{background:var(--gold);color:#000;border-color:var(--gold)}
.totline{display:flex;justify-content:space-between;padding:.3rem 0}
.totline.big{font-size:18px;font-weight:700;border-top:1px solid var(--border);margin-top:.4rem;padding-top:.6rem}
.gain{color:var(--green)}

/* Tablas */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--soft);padding:.5rem .4rem;border-bottom:1px solid var(--border)}
td{padding:.5rem .4rem;border-bottom:1px solid var(--border);font-size:13px}
.cell-in{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:.3rem;width:62px;text-align:right;font-size:13px}

/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1rem}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.9rem}
.kpi .v{font-size:24px;font-weight:700}
.kpi .l{font-size:11px;color:var(--soft);text-transform:uppercase}
.bar-row{display:flex;align-items:center;gap:.5rem;margin:.3rem 0;font-size:12px}
.bar-track{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--gold)}
.empty{text-align:center;color:var(--soft);padding:2rem 1rem}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:1.2rem;width:100%;max-width:520px;max-height:85vh;overflow:auto}
@media(min-width:600px){.modal-bg{align-items:center}.modal-box{border-radius:16px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <h1>🦁 Polos593 — Ventas</h1>
  <select id="login-vendedor" class="fld" style="width:260px"><option value="">Cargando vendedores…</option></select>
  <input id="login-pin" type="tel" inputmode="numeric" placeholder="PIN de acceso" maxlength="8">
  <button onclick="doLogin()">Entrar</button>
  <div class="login-err" id="login-err"></div>
  <div class="muted" style="font-size:11px">Tu acceso queda guardado en este dispositivo</div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <span class="brand">🦁 Polos593</span>
    <div style="display:flex;align-items:center;gap:.6rem">
      <span class="who" id="who"></span>
      <button onclick="logout()" style="background:var(--surface2);border:1px solid var(--border);color:var(--soft);padding:.35rem .7rem;border-radius:8px;font-size:12px;cursor:pointer">Salir</button>
    </div>
  </div>
  <div class="main" id="view"></div>
  <div class="nav">
    <button data-tab="vender" class="active" onclick="go('vender')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
      Vender
    </button>
    <button data-tab="envios" onclick="go('envios')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      <span>Envíos<span class="nav-count" id="nav-envios" style="display:none"></span></span>
    </button>
    <button data-tab="vendedores" onclick="go('vendedores')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 4.8"/></svg>
      <span>Vendedores<span class="nav-count" id="nav-vend" style="display:none"></span></span>
    </button>
    <button data-tab="inventario" onclick="go('inventario')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></svg>
      Inventario
    </button>
    <button data-tab="socios" onclick="go('socios')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 15a9 9 0 0 1 18 0"/><path d="M3 15h20"/><path d="M12 6V4"/></svg>
      Gorras
    </button>
    <button data-tab="cuentas" onclick="go('cuentas')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M16 15h2"/><path d="M6 6V4h12v2"/></svg>
      Cuentas
    </button>
    <button data-tab="reportes" onclick="go('reportes')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Reportes
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box" id="modal-box"></div></div>

<script>
const SUPABASE_URL = 'https://zopeclhjnlfpgldflarp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EzKXkvdHpyPs_m_76J9kZg_l3BJIoor';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ENVIO = { guayaquil: 3.50, provincia: 6.50 };
// Contra entrega (Pardux): sale de Guayaquil, al cliente se le cobra $5 o $6 de envío y el
// costo real de Pardux (no es tarifa fija) se registra después, al cargar la guía en Envíos.
const COD_ENVIOS = [5, 6];
const EST_ENVIO = {
  por_despachar:{txt:'📝 Por despachar', badge:'b-cod'},
  en_camino:    {txt:'🚚 En camino',     badge:'b-local'},
  entregado:    {txt:'✅ Entregado y cobrado', badge:'b-local'},
  depositado:   {txt:'💰 Depositado',    badge:'b-local'},
  rechazado:    {txt:'↩️ Rechazado',     badge:'b-drop'}
};
const COD_COBRADO = v => v.tipo==='contraentrega' && (v.estado_envio==='entregado' || v.estado_envio==='depositado');
// Tarifa de comisión por prenda. Contra entrega solo paga cuando ya se entregó y cobró.
function tarifaCom(v){
  if(v.tipo==='contraentrega') return COD_COBRADO(v) ? parseFloat(CONFIG.comision_contraentrega||CONFIG.comision_dropship||'2') : 0;
  return v.tipo==='dropshipping' ? parseFloat(CONFIG.comision_dropship||'2') : parseFloat(CONFIG.comision_local||'1');
}
const TIPO_BADGE = t => t==='local' ? ['b-local','LOCAL','LOC'] : t==='contraentrega' ? ['b-cod','CONTRA ENTREGA','COD'] : ['b-drop','DROPSHIP','DROP'];
const BAILEYS_URL = 'https://whatsapp-baileys-production-3e0b.up.railway.app';
const ADMIN_NAMES = ['Homero'];          // quién ve Reportes e Inventario
// Ventas del programa de vendedores ("Vend · Nombre" / "Kit · Nombre"): su comisión se paga en la
// pestaña Vendedores, así que no cuentan como comisión de asesor.
// Socios (17 nov 2026): Dani vende las gorras que compraron a medias con Homero. No cobra comisión: se reparten la ganancia.
const SOCIOS = ['Dani'];
// Vendedores que solo pueden vender ciertas prendas
const SOLO_TIPOS = { 'Dani':['gorra_jinete'] };
const sinComAsesor = n => ADMIN_NAMES.includes(n) || SOCIOS.includes(n) || /^(Vend|Kit) · /.test(n||'');
let VENDEDOR = localStorage.getItem('p593_vendedor') || '';
let ES_ADMIN = localStorage.getItem('p593_admin') === '1';
let CONFIG = {};                          // pin, pin_admin, whatsapp_admin
let cart = [];
let productosCache = [];

const money = n => '$' + (Number(n)||0).toFixed(2);
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

// ── LOGIN ──
async function initLogin(){
  const { data } = await db.from('vendedores').select('nombre').eq('activo',true).order('nombre');
  const sel = document.getElementById('login-vendedor');
  sel.innerHTML = '<option value="">Elige tu nombre…</option>' + (data||[]).map(v=>`<option>${v.nombre}</option>`).join('');
  if (VENDEDOR && localStorage.getItem('p593_auth')==='1'){
    // Admin con sesión vieja sin rol guardado → pedir de nuevo el PIN de admin
    if (ADMIN_NAMES.includes(VENDEDOR) && localStorage.getItem('p593_admin')!=='1'){
      localStorage.removeItem('p593_auth');
      sel.value = VENDEDOR;
      return;
    }
    ES_ADMIN = localStorage.getItem('p593_admin')==='1';
    enterApp();
  }
}
async function loadConfig(){
  const { data } = await db.from('config').select('*');
  CONFIG = {}; (data||[]).forEach(c=>CONFIG[c.clave]=c.valor);
}
async function doLogin(){
  const v = document.getElementById('login-vendedor').value;
  const pin = document.getElementById('login-pin').value.trim();
  const err = document.getElementById('login-err');
  if(!v){ err.textContent='Elige tu nombre'; return; }
  await loadConfig();
  const esAdmin = ADMIN_NAMES.includes(v);
  const pinPersonal = CONFIG['pin_'+v];   // vendedores con clave propia (ej. Dani)
  const pinOk = esAdmin ? (pin === (CONFIG.pin_admin||'5930')) : (pinPersonal ? pin === pinPersonal : pin === (CONFIG.pin||'0593'));
  if(!pinOk){ err.textContent = esAdmin ? 'PIN de administrador incorrecto' : 'PIN incorrecto'; return; }
  VENDEDOR = v; ES_ADMIN = esAdmin;
  localStorage.setItem('p593_vendedor', v);
  localStorage.setItem('p593_admin', esAdmin?'1':'0');
  localStorage.setItem('p593_auth','1');
  enterApp();
}
async function enterApp(){
  if(!Object.keys(CONFIG).length) await loadConfig();
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('who').textContent = (ES_ADMIN?'👑 ':'👤 ')+VENDEDOR;
  // Asesores: solo Vender. Admin (Homero): todas las pantallas.
  document.querySelectorAll('.nav button').forEach(b=>{
    const t=b.dataset.tab;
    const socio = SOCIOS.includes(VENDEDOR);
    b.style.display = (!ES_ADMIN && (t==='inventario'||t==='reportes'||t==='cuentas')) ? 'none'
      : (t==='socios' && !(ES_ADMIN||socio)) ? 'none'
      : (socio && (t==='envios'||t==='vendedores')) ? 'none' : '';
  });
  go('vender');
  actualizarBadgeEnvios();
  revBadge();
}
function logout(){ localStorage.removeItem('p593_auth'); location.reload(); }

// ── NAV ──
let TAB='vender';
function go(tab){
  if(!ES_ADMIN && (tab==='inventario'||tab==='reportes'||tab==='cuentas')) tab='vender'; // asesor: solo Vender
  if(tab==='socios' && !(ES_ADMIN || SOCIOS.includes(VENDEDOR))) tab='vender';
  TAB=tab;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if(tab==='vender') renderVender();
  if(tab==='envios') renderEnvios();
  if(tab==='inventario') renderInventario();
  if(tab==='reportes') renderReportes();
  if(tab==='vendedores') renderVendedores();
  if(tab==='cuentas') renderCuentas();
  if(tab==='socios') renderSocios();
}

async function loadProductos(){
  const { data } = await db.from('productos').select('*').eq('activo',true).order('nombre');
  productosCache = data||[];
  return productosCache;
}

// ════════════ VENDER ════════════
async function renderVender(){
  const v=document.getElementById('view');
  v.innerHTML='<div class="empty">Cargando…</div>';
  await Promise.all([loadProductos(), cargarConfigCuentas()]);
  v.innerHTML = `
    <div id="cod-banner"></div>
    <div class="seg" style="margin-bottom:1rem">
      <button class="${MODO==='venta'?'on':''}" onclick="setModo('venta')">🧾 Venta a un cliente<br><small style="font-weight:400;font-size:11px">local · dropshipping · contra entrega</small></button>
      <button class="${MODO==='stock'?'on':''}" onclick="setModo('stock')">📥 Ingreso de mercadería<br><small style="font-weight:400;font-size:11px">sin cliente · entra al stock</small></button>
    </div>
    <h2 class="page">${MODO==='stock'?'Ingreso de mercadería':'Nueva venta'}</h2>
    ${MODO==='stock'?`<div class="card" style="border-left:3px solid var(--yellow);margin-top:-.4rem">
      <b>⚠️ Esto NO es una venta.</b> Registra lo que la proveedora mandó a la tienda: suma al stock y a ella solo le queda esta referencia con lo que se le debe.
      <div class="muted" style="font-size:12px;margin-top:.3rem">Cuando vendas o entregues esas prendas, regístralo como venta <b>🏬 Local</b>. Si ella despacha directo al cliente, eso es <b>dropshipping</b>.</div>
      <button class="btn btn-gold" style="width:100%;margin-top:.6rem" onclick="irADropshipping()">🧾 Ir a Venta → Dropshipping</button></div>`:''}
    <div class="card">
      <div id="wizard"></div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between"><b>${MODO==='stock'?'📥 Prendas que entraron':'🛒 Carrito'}</b><span class="muted" id="cart-count">0 items</span></div>
      <div id="cart"></div>
    </div>
    <div class="card" id="checkout" style="display:none">
      <label class="lbl">Tipo de venta</label>
      <div class="seg" style="margin-bottom:.8rem">

async function crearColorNuevo(){
  let color=(document.getElementById('nc-color').value||'').trim().replace(/\s+/g,' ');
  if(color.length<3){ toast('Escribe el nombre del color'); return; }
  color=color.charAt(0).toUpperCase()+color.slice(1);
  const base=productosCache.filter(p=>p.tipo===SEL.prenda);
  if(!base.length){ toast('No hay productos base de esta prenda'); return; }
  if(base.some(p=>p.color.toLowerCase()===color.toLowerCase())){ closeModal(); pickColor(base.find(p=>p.color.toLowerCase()===color.toLowerCase()).color); return; }
  const limpio=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z ]/g,'');
  const pal=limpio(color).split(' ').filter(Boolean);
  let cod=(pal[0]||'X').slice(0,3)+pal.slice(1).filter(w=>!['DE','CON','Y','LOGO'].includes(w)).map(w=>w[0]).join('');
  const pref=String(base[0].sku).split('-')[0];

  const filas=[]; let n=1, sku0;
  const existe=k=>productosCache.some(p=>p.sku===k);
  while(tallas.some(t=>existe(`${pref}-${cod}${n>1?n:''}-${String(t).slice(0,3).toUpperCase()==='ÚNI'?'U':t}`))) n++;
  if(n>1) cod=cod+n;
  for(const t of tallas){
    const m=base.find(p=>p.talla===t);
    const sku=`${pref}-${cod}-${String(t).toUpperCase().startsWith('ÚNI')||String(t).toUpperCase().startsWith('UNI')?'U':t}`; sku0=sku0||sku;
    filas.push({sku, tipo:m.tipo, nombre:m.nombre, genero:m.genero, color, talla:t, costo:m.costo, precio_venta:m.precio_venta, stock:0, activo:true});

let PM={}, PROVS={}, MAYORISTAS=[], MAY_SEL='', MAY_ORIGEN='tienda', MAY_COBRA_ENVIO=true;

function calcTotales(){
  const subtotal = cart.reduce((s,c)=>s+c.precio_unit*c.cantidad,0);
  const costo = cart.reduce((s,c)=>s+c.costo_unit*c.cantidad,0);
  let costoEnvio=0, envioCobrado=0;
  if(TIPO==='dropshipping'){
    const zona=document.getElementById('zona').value;
    costoEnvio=ENVIO[zona];
    envioCobrado = ENVIO_MODO==='cliente'? costoEnvio : 0;
  } else if(TIPO==='contraentrega'){
    // El costo real de Pardux se conoce al generar la guía; hasta entonces se asume igual
    // a lo cobrado (neutro) y la ganancia se muestra como estimada.
    envioCobrado = COD_ENVIO; costoEnvio = COD_ENVIO;
  } else if(TIPO==='mayorista' && MAY_ORIGEN==='proveedora'){
    costoEnvio = Math.max(0, parseFloat((document.getElementById('may-envio')||{}).value)||0);
    envioCobrado = MAY_COBRA_ENVIO ? costoEnvio : 0;
  }
  // Descuento: por porcentaje de los productos, o "precio final" = TOTAL que paga el
  // cliente (envío incluido). El precio final siempre se respeta tal cual lo escribe
  // el vendedor; si queda por encima del precio de lista, descuentoMonto sale negativo
  // (un recargo) y la ganancia sube en consecuencia.
  let descuentoMonto=0, descTipo=null, descVal=0;
  const dv = parseFloat((document.getElementById('desc-val')||{}).value)||0;
  if(DESC_TIPO==='porcentaje' && dv>0){ descTipo='porcentaje'; descVal=Math.min(dv,100); descuentoMonto = subtotal*descVal/100; }
  else if(DESC_TIPO==='monto_final' && dv>0){ descTipo='monto_final'; descVal=dv; descuentoMonto = (subtotal+envioCobrado) - dv; }
  descuentoMonto = Math.round(descuentoMonto*100)/100;
  const total = subtotal + envioCobrado - descuentoMonto;
  const ganancia = total - costo - costoEnvio;
  const el=document.getElementById('totales');
  if(el) el.innerHTML = `
    <div class="totline"><span class="muted">Productos</span><span>${money(subtotal)}</span></div>
    ${TIPO==='dropshipping'?`<div class="totline"><span class="muted">Envío cobrado al cliente</span><span>${money(envioCobrado)}</span></div>
      <div class="totline"><span class="muted">Costo de envío (lo pagas tú)</span><span>-${money(costoEnvio)}</span></div>`:''}
    ${TIPO==='contraentrega'?`<div class="totline"><span class="muted">Envío cobrado al cliente</span><span>${money(envioCobrado)}</span></div>
      <div class="totline"><span class="muted">Costo Pardux</span><span class="muted">se registra al cargar la guía</span></div>`:''}
    ${descuentoMonto>0?`<div class="totline"><span class="muted">Descuento ${descTipo==='porcentaje'?'('+descVal+'%)':''}</span><span style="color:var(--red)">-${money(descuentoMonto)}</span></div>`:''}
    ${descuentoMonto<0?`<div class="totline"><span class="muted">Ajuste por precio final</span><span>+${money(-descuentoMonto)}</span></div>`:''}
    ${TIPO==='mayorista'&&MAY_ORIGEN==='proveedora'?`<div class="totline"><span class="muted">Envío ${MAY_COBRA_ENVIO?'que le cobras':'(lo asumes tú)'}</span><span>${MAY_COBRA_ENVIO?money(envioCobrado):'-'+money(costoEnvio)}</span></div>`:''}
    <div class="totline big"><span>${TIPO==='contraentrega'?'Total que cobra Pardux al entregar':'Total a cobrar'}</span><span>${money(total)}</span></div>
    ${TIPO==='mayorista'?(()=>{ const ab=Math.min(total,Math.max(0,parseFloat((document.getElementById('may-abono')||{}).value)||0)); return `<div class="totline"><span class="muted">Te pagó ahora</span><span>${money(ab)}</span></div><div class="totline"><span>Queda debiendo de esta entrega</span><b style="color:var(--yellow)">${money(total-ab)}</b></div>`; })():''}
    ${ES_ADMIN?`<div class="totline"><span class="muted">Tu ganancia${TIPO==='contraentrega'?' (estimada, antes del costo Pardux)':''}</span><span class="gain">${money(ganancia)}</span></div>`:''}`;
  return {subtotal,costo,descuentoMonto,descTipo,descVal,costoEnvio,envioCobrado,total,ganancia};
}
async function registrarVenta(){
  if(!cart.length) return;

  }
  // Venta en el local de una prenda que el sistema NO tiene en tienda: casi siempre es otro color/talla mal elegido.
  // Se frena y se muestran las que sí hay; solo sigue si la vendedora confirma que es esa.
  let sinStockNota=null;

  const may = esMay ? MAYORISTAS.find(m=>m.id===MAY_SEL) : null;

    const faltan=cart.filter(c=>{ const p=productosCache.find(x=>x.sku===c.sku); return p && enTienda(p) < c.cantidad; });
    if(faltan.length && !window._okSinStock){ avisoSinStock(faltan); return; }
    if(faltan.length) sinStockNota='⚠ Vendida sin stock en el sistema: '+faltan.map(c=>c.sku).join(', ');
  }
  window._okSinStock=false;
  btn.disabled=true; btn.textContent='Guardando…';
  const t=calcTotales();
  const esCOD = TIPO==='contraentrega';
  const conEnvio = TIPO==='dropshipping' || esCOD;
  const esEntrega = TIPO==='local' && ENTREGA==='entrega_quito';

  // Dropshipping y contra entrega necesitan destino + teléfono (para el courier y el CRM)
  if(conEnvio && (!ciudad || !direccion || !telefono)){
    toast((esCOD?'Contra entrega':'Dropshipping')+' necesita teléfono, ciudad y dirección'); btn.disabled=false; btn.textContent='✅ Registrar venta'; return;
  }
  const venta = {
    tipo:TIPO, vendedor:VENDEDOR,
    cliente_nombre: esMay ? may.nombre : (document.getElementById('c-nombre').value||null),
    cliente_telefono: esMay ? (may.telefono||telefono) : telefono, cedula,
    ciudad: esMay ? (ciudad||may.ciudad||null) : ciudad, zona_envio:zona, costo_envio:t.costoEnvio, envio_cobrado:t.envioCobrado,
    descuento_tipo:t.descTipo, descuento_valor:t.descVal, descuento_monto:t.descuentoMonto,
    subtotal:t.subtotal, total:t.total, costo_productos:t.costo, ganancia:t.ganancia,
    metodo_pago: esCOD ? 'Contra entrega' : document.getElementById('pago').value,
    notas: [esMay?('🤝 Mayorista · '+(MAY_ORIGEN==='tienda'?'de la tienda':'la envía la proveedora')):null, direccion, sinStockNota].filter(Boolean).join(' · ')||null  // dirección exacta (+ aviso si se vendió sin stock)
  };
  const abono = esMay ? Math.min(t.total, Math.max(0, parseFloat(document.getElementById('may-abono').value)||0)) : 0;
  if(esMay){ venta.mayorista_id = may.id; if(!(abono>0)) venta.metodo_pago='Crédito'; }
  if(esCOD){ venta.estado_envio='por_despachar'; venta.estado_envio_at=new Date().toISOString(); }
  const { data:vRow, error } = await db.from('ventas').insert(venta).select().single();
  if(error){ toast('Error: '+error.message); btn.disabled=false; btn.textContent='✅ Registrar venta'; return; }
  const esLocal = esLocalVenta();
  const items = cart.map(c=>({venta_id:vRow.id, sku:c.sku, nombre:c.nombre, talla:c.talla, cantidad:c.cantidad, precio_unit:c.precio_unit, costo_unit:c.costo_unit, es_local:esLocal}));
  await db.from('venta_items').insert(items);
  // datos para compartir (incluyen COLOR, que no se guarda en venta_items)
  const shareItems = cart.map(c=>({nombre:c.nombre, color:c.color, talla:c.talla, cantidad:c.cantidad, precio_unit:c.precio_unit, costo_unit:c.costo_unit}));
  venta.direccion = direccion;
  const folio = vRow.folio;
  if(esMay){
    if(abono>0) await db.from('mayorista_pagos').insert({ mayorista_id:may.id, monto:abono, metodo:document.getElementById('pago').value, nota:'Pago al recibir la entrega #'+folio, registrado_por:VENDEDOR });
  } else await sincronizarCRM(venta, shareItems, folio);

// Alimenta el CRM (mismo Supabase que usa crm-dashboard.html): cada venta de esta
// app también queda como pedido en el CRM, para tener una sola fuente de verdad
// entre las ventas web y los pedidos que llegan por conversación de WhatsApp.
async function sincronizarCRM(venta, items, folio){
  const phone = (venta.cliente_telefono||'').replace(/\D/g,'');
  // Contra entrega todavía no está cobrada: queda "pendiente" hasta que Pardux entregue.
  const statusCRM = venta.tipo==='local' ? 'entregado' : venta.tipo==='contraentrega' ? 'pendiente' : 'pagado';
  const statusCliente = statusCRM==='pendiente' ? 'pedido_pendiente' : statusCRM;
  if(phone){
    try{
      await db.from('clientes').upsert({
        phone, name: venta.cliente_nombre||'Cliente', city: venta.ciudad||null,
        status: statusCliente, source: 'ventas-app', last_contact: new Date().toISOString()
      }, { onConflict: 'phone' });
    }catch(e){ /* no bloquea el registro de la venta */ }
  }
  const corto = n => (n||'').replace('Camisa Manga Larga Polo Ralph Lauren','Camisa').replace('Cuello Redondo','Redonda');
  const itemsPedido = items.map(i=>({ nombre:(i.cantidad>1?i.cantidad+'x ':'')+corto(i.nombre), color:i.color||'', talla:i.talla||'', precio:i.precio_unit }));
  const notas = [
    `Venta #${folio} · ${venta.tipo==='local'?(venta.zona_envio==='entrega_quito'?'🛵 Entrega en Quito (del stock)':'🏬 Local'):venta.tipo==='contraentrega'?'🚚 Contra entrega (Pardux)':'📦 Dropshipping'} · Vendedor: ${venta.vendedor}`,
    venta.cedula ? `CI: ${venta.cedula}` : null,
    venta.direccion ? `Dirección: ${venta.direccion}` : null,
    venta.descuento_monto>0 ? `Descuento aplicado: -${money(venta.descuento_monto)}` : null,
    venta.descuento_monto<0 ? `Ajuste por precio final: +${money(-venta.descuento_monto)}` : null
  ].filter(Boolean).join(' — ');
  try{
    await db.from('pedidos').insert({
      cliente_phone: phone||null, cliente_name: venta.cliente_nombre||null, ciudad: venta.ciudad||null,
      items: itemsPedido, total: venta.total, status: statusCRM, asesor: venta.vendedor, notes: notas
    });
  }catch(e){ /* no bloquea el registro de la venta */ }
}
// Link wa.me que abre la conversación con Homero y el mensaje ya escrito.
// OJO: el texto lo ve el asesor, por eso NO incluye la ganancia.
function waLink(venta, items, folio){
  const num = (CONFIG.whatsapp_admin||'593983209216').replace(/\D/g,'');
  const corto = n => (n||'').replace('Camisa Manga Larga Polo Ralph Lauren','Camisa').replace('Cuello Redondo','Redonda');
  const prenda = i => `• ${i.cantidad}x ${corto(i.nombre)} ${i.color||''} ${i.talla||''}`.replace(/ +/g,' ').trim();
  let msg;
  if(venta.tipo==='contraentrega'){
    // Pedido a la proveedora de Guayaquil, despachado por Pardux con cobro al cliente
    const lineas = items.map(prenda).join('\n');
    const costoP = items.reduce((s,i)=>s+(+i.costo_unit||0)*i.cantidad,0);
    msg = `🚚 PEDIDO CONTRA ENTREGA #${folio} (Pardux)\n👤 Vendedor: ${venta.vendedor||VENDEDOR}\n\n${lineas}\n\n💵 A pagar a proveedora: ${money(costoP)} (prendas)\n💰 *Pardux cobra al cliente: ${money(venta.total)}*\n\n📍 Ciudad: ${venta.ciudad||'—'}\n🏠 Dirección: ${venta.direccion||'—'}${venta.cliente_telefono?'\n📞 '+venta.cliente_telefono:''}${venta.cliente_nombre?'\n🧍 '+venta.cliente_nombre:''}${venta.cedula?'\n🪪 CI: '+venta.cedula:''}`;
  } else if(venta.tipo==='dropshipping'){
    // Pedido para la proveedora: SIN precios de venta, con costo a pagar + envío + destino
    const lineas = items.map(prenda).join('\n');
    const costoP = items.reduce((s,i)=>s+(+i.costo_unit||0)*i.cantidad,0);
    const env = +venta.costo_envio||0;
    msg = `📦 PEDIDO DROPSHIPPING #${folio}\n👤 Vendedor: ${venta.vendedor||VENDEDOR}\n\n${lineas}\n\n💵 *A pagar a proveedora: ${money(costoP+env)}*\n   Prendas ${money(costoP)} + Envío ${money(env)}\n\n📍 Ciudad: ${venta.ciudad||'—'}\n🏠 Dirección: ${venta.direccion||'—'}${venta.cliente_telefono?'\n📞 '+venta.cliente_telefono:''}${venta.cliente_nombre?'\n🧍 '+venta.cliente_nombre:''}${venta.cedula?'\n🪪 CI: '+venta.cedula:''}`;
  } else {
    const lineas = items.map(i=>`${prenda(i)} (${money(i.precio_unit)})`).join('\n');
    const cli = [venta.cliente_nombre, venta.cedula, venta.cliente_telefono, venta.ciudad].filter(Boolean).join(' · ');
    const cliLine = cli ? `\n🧍 Cliente: ${cli}` : '';
    const desc = (venta.descuento_monto>0) ? `\n🏷️ Descuento: -${money(venta.descuento_monto)}`
               : (venta.descuento_monto<0) ? `\n🏷️ Ajuste por precio final: +${money(-venta.descuento_monto)}` : '';
    msg = `🧾 NUEVA VENTA #${folio}\n${venta.zona_envio==='entrega_quito'?'🛵 ENTREGA EN QUITO (del stock)':'🏬 LOCAL'}${cliLine}\n👤 Vendedor: ${venta.vendedor||VENDEDOR}\n\n${lineas}${desc}\n\n💰 Total: ${money(venta.total)}\n💳 ${venta.metodo_pago||''}`;
  }
  return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}

// Busca el pedido del CRM que corresponde a una venta (se crea con notes "Venta #N · …")
async function pedidoDeVenta(folio){
  const { data } = await db.from('pedidos').select('id,notes,cliente_phone,status').like('notes',`Venta #${folio} ·%`).limit(1);
  return (data||[])[0]||null;
}
async function guardarGuiaEnvio(id){
  const x=(window._envCache||[]).find(v=>v.id===id); if(!x) return;
  const guia=(document.getElementById('guia-'+id).value||'').trim();
  const link=(document.getElementById('link-'+id).value||'').trim();
  const costoTxt=(document.getElementById('costo-'+id).value||'').trim();
  if(!guia){ toast('Escribe el número de guía de Pardux'); return; }
  if(link && !/^https?:\/\//i.test(link)){ toast('El link debe empezar con https://'); return; }
  const upd={ guia_envio:guia, tracking_url:link||null, estado_envio_at:new Date().toISOString() };
  if(x.estado_envio==='por_despachar') upd.estado_envio='en_camino';
  if(costoTxt!==''){
    const c=parseFloat(costoTxt);
    if(isNaN(c)||c<0){ toast('Costo Pardux inválido'); return; }
    upd.costo_envio=c;
    upd.ganancia=Math.round(((+x.total)-(+x.costo_productos)-c)*100)/100;
  }
  const { error } = await db.from('ventas').update(upd).eq('id',id);
  if(error){ toast('Error: '+error.message); return; }
  // Reflejar en el CRM: guía + estado enviado + link en las notas
  const p=await pedidoDeVenta(x.folio);
  if(p){
    let notes=(p.notes||'').replace(/ — Seguimiento Pardux: \S+/,'');
    if(link) notes+=` — Seguimiento Pardux: ${link}`;
    await db.from('pedidos').update({ guia_servientrega:guia, status: p.status==='entregado'?'entregado':'enviado', notes, updated_at:new Date().toISOString() }).eq('id',p.id);
  }
  toast(upd.estado_envio==='en_camino'?'🚚 Pedido en camino':'✓ Guía actualizada');
  renderEnvios();
}
async function cambiarEstadoEnvio(id, nuevo){
  const x=(window._envCache||[]).find(v=>v.id===id); if(!x) return;
  if(nuevo==='rechazado' && !confirm(`¿Marcar la venta #${x.folio} como RECHAZADA?\nLa venta queda anulada: no suma ingresos ni comisión.`)) return;
  if(nuevo==='entregado' && !confirm(`¿Pardux ya entregó la venta #${x.folio} y cobró ${money(x.total)}?`)) return;
  if(nuevo==='depositado' && !confirm(`¿Confirmas que Pardux ya depositó ${money(x.total)} de la venta #${x.folio}?`)) return;
  const upd={ estado_envio:nuevo, estado_envio_at:new Date().toISOString() };
  if(nuevo==='rechazado') upd.anulada=true;
  if(x.estado_envio==='rechazado' && nuevo!=='rechazado') upd.anulada=false;   // reabrir
  const { error } = await db.from('ventas').update(upd).eq('id',id);
  if(error){ toast('Error: '+error.message); return; }
  const p=await pedidoDeVenta(x.folio);
  if(p){
    const stPed = nuevo==='rechazado'?'cancelado' : (nuevo==='entregado'||nuevo==='depositado')?'entregado' : 'enviado';
    const stCli = {cancelado:'perdido', entregado:'entregado', enviado:'pedido_pendiente'}[stPed];
    await db.from('pedidos').update({ status:stPed, updated_at:new Date().toISOString() }).eq('id',p.id);
    if(p.cliente_phone) await db.from('clientes').update({ status:stCli }).eq('phone',p.cliente_phone);
  }
  toast({entregado:'✅ Entregado y cobrado', depositado:'💰 Marcado como depositado', rechazado:'↩️ Venta anulada por rechazo', en_camino:'↺ Reabierto'}[nuevo]||'✓');
  renderEnvios();
}

// ════════════ REPORTES (con rango de fechas) ════════════
let REP_DESDE=null, REP_HASTA=null, REP_LABEL='Hoy';
function rangoPreset(p){
  const now=new Date(); const d0=new Date(); d0.setHours(0,0,0,0);
  if(p==='hoy'){ REP_DESDE=d0; REP_HASTA=now; REP_LABEL='Hoy'; }
  else if(p==='ayer'){ const a=new Date(d0); a.setDate(a.getDate()-1); REP_DESDE=a; REP_HASTA=new Date(d0.getTime()-1); REP_LABEL='Ayer'; }
  else if(p==='7'){ const a=new Date(d0); a.setDate(a.getDate()-6); REP_DESDE=a; REP_HASTA=now; REP_LABEL='Últimos 7 días'; }
  else if(p==='30'){ const a=new Date(d0); a.setDate(a.getDate()-29); REP_DESDE=a; REP_HASTA=now; REP_LABEL='Últimos 30 días'; }
  else if(p==='mes'){ REP_DESDE=new Date(now.getFullYear(),now.getMonth(),1); REP_HASTA=now; REP_LABEL='Este mes'; }
  renderReportes();
}
function rangoCustom(){
  const d=document.getElementById('rep-desde').value, h=document.getElementById('rep-hasta').value;
  if(d) REP_DESDE=new Date(d+'T00:00:00');
  if(h) REP_HASTA=new Date(h+'T23:59:59');
  REP_LABEL='Personalizado';
  renderReportes();
}

// Comisiones agrupadas por mes calendario, TODO el histórico (no depende del filtro de fecha de arriba).
// Sirve para saber cuánto pagarle a cada vendedor mes a mes.
async function comisionesPorMesHTML(COM_LOCAL,COM_DROP){
  const { data:all } = await db.from('ventas').select('*').eq('anulada',false);
  const noAdmin=(all||[]).filter(v=>!sinComAsesor(v.vendedor));
  const ids=noAdmin.map(v=>v.id);
  let items=[];
  if(ids.length){ const {data:it}=await db.from('venta_items').select('venta_id,cantidad').in('venta_id',ids); items=it||[]; }
  const unitsByVenta={}; items.forEach(i=>{ unitsByVenta[i.venta_id]=(unitsByVenta[i.venta_id]||0)+i.cantidad; });
  const porMes={};
  noAdmin.forEach(v=>{
    const mes=v.fecha.slice(0,7);
    const units=unitsByVenta[v.id]||0;
    const com=(v.comision_ajustada!=null)?+v.comision_ajustada:units*tarifaCom(v);
    porMes[mes]=porMes[mes]||{};
    porMes[mes][v.vendedor]=(porMes[mes][v.vendedor]||0)+com;
  });
  const meses=Object.keys(porMes).sort().reverse();
  if(meses.length===0) return '<div class="empty">Aún no hay comisiones registradas</div>';
  const nombreMes = m => { const [y,mm]=m.split('-'); return new Date(+y,+mm-1,1).toLocaleDateString('es-EC',{month:'long',year:'numeric'}); };
  return meses.map(m=>{
    const vend=Object.entries(porMes[m]).sort((a,b)=>b[1]-a[1]);
    const totalMes=vend.reduce((s,e)=>s+e[1],0);
    return `<div style="margin-bottom:1rem">
      <div style="display:flex;justify-content:space-between;font-weight:600;text-transform:capitalize;margin-bottom:.3rem">
        <span>${nombreMes(m)}</span><span style="color:var(--gold)">${money(totalMes)}</span>
      </div>
      <table><tbody>
      ${vend.map(([k,val])=>`<tr><td>${k}</td><td style="text-align:right;color:var(--gold)">${money(val)}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
  }).join('');
}

// Formulario: elegir qué prendas y cuántas devolver de una venta.
function abrirDevolucion(ventaId){
  const v=(window._ventasCache||[]).find(x=>x.id===ventaId); if(!v) return;
  const its=(window._itemsByVenta||{})[ventaId]||[];
  const corto=n=>(n||'').replace('Camisa Manga Larga Polo Ralph Lauren','Camisa').replace('Cuello Redondo','Redonda');
  const filas=its.map((i,idx)=>`
    <div class="totline" style="align-items:center">
      <span style="flex:1">${corto(i.nombre)} ${i.talla||''} <span class="muted">(${i.cantidad} vend · ${money(i.precio_unit)})</span></span>
      <div class="qtybox">
        <button onclick="devQ(${idx},-1,${i.cantidad})">−</button>
        <span id="devq-${idx}" data-q="0" data-precio="${i.precio_unit}" data-sku="${i.sku}" data-max="${i.cantidad}" style="min-width:22px;text-align:center">0</span>
        <button onclick="devQ(${idx},1,${i.cantidad})">+</button>
      </div>
    </div>`).join('');
  const html=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem">
      <h3 style="font-size:17px">↩️ Devolución — Venta #${v.folio}</h3>
      <button onclick="verVenta('${ventaId}')" class="btn btn-ghost" style="padding:.3rem .7rem">✕</button>
    </div>
    <p class="muted" style="font-size:12px;margin-bottom:.7rem">Elige cuántas prendas devuelve el cliente. ${v.tipo==='local'?'Se repone el stock de tienda automáticamente.':'(Dropshipping: no afecta el stock de tienda.)'}</p>
    <div style="border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:.4rem 0;margin-bottom:.7rem">${filas}</div>
    <label class="lbl">Monto a devolver al cliente</label>
    <input class="fld" id="dev-monto" type="number" step="0.5" value="0.00" style="margin-bottom:.7rem">
    <label class="lbl">Motivo</label>
    <input class="fld" id="dev-motivo" placeholder="Ej: talla equivocada, defecto…" style="margin-bottom:.9rem">
    <button class="btn btn-green" style="width:100%;padding:.8rem" onclick="guardarDevolucion('${ventaId}')">Confirmar devolución</button>`;
  showModal(html);
}
function devQ(idx,d,max){
  const el=document.getElementById('devq-'+idx);
  let q=(+el.dataset.q)+d; if(q<0)q=0; if(q>max)q=max;
  el.dataset.q=q; el.textContent=q;
  // recalcular monto sugerido = suma prendas devueltas a precio unitario
  let m=0; document.querySelectorAll('[id^="devq-"]').forEach(s=>{ m+=(+s.dataset.q)*(+s.dataset.precio); });
  document.getElementById('dev-monto').value=m.toFixed(2);
}
async function guardarDevolucion(ventaId){
  const v=(window._ventasCache||[]).find(x=>x.id===ventaId); if(!v) return;
  const items=[];
  document.querySelectorAll('[id^="devq-"]').forEach(s=>{
    const q=+s.dataset.q; if(q>0) items.push({ sku:s.dataset.sku, cantidad:q, precio_unit:+s.dataset.precio });
  });
  if(items.length===0){ toast('Elige al menos 1 prenda a devolver'); return; }
  const monto=parseFloat(document.getElementById('dev-monto').value)||0;
  const motivo=document.getElementById('dev-motivo').value||null;
  // nombres para el registro
  const its=(window._itemsByVenta||{})[ventaId]||[];
  items.forEach(it=>{ const src=its.find(x=>x.sku===it.sku); if(src){ it.nombre=src.nombre; it.talla=src.talla; it.costo_unit=src.costo_unit; }});
  const repuso = v.tipo==='local';
  const { error } = await db.from('devoluciones').insert({
    venta_id:ventaId, venta_folio:v.folio, vendedor:v.vendedor, cliente_nombre:v.cliente_nombre,
    tipo:v.tipo, items, monto, repuso_stock:repuso, motivo
  });
  if(error){ toast('Error: '+error.message); return; }
  // reponer stock si fue venta local (el producto vuelve a la tienda)
  if(repuso){
    for(const it of items){
      const { data:p } = await db.from('productos').select('stock').eq('sku',it.sku).single();
      if(p) await db.from('productos').update({ stock:(p.stock||0)+it.cantidad }).eq('sku',it.sku);
    }
  }
  toast('✓ Devolución registrada'+(repuso?' · stock repuesto':''));
  closeModal();
  renderReportes();
}

  return `<div class="grid2" style="margin-bottom:.4rem">

function pkUpd(px, nivel){
  const g=document.getElementById(px+'-gen').value, ti=document.getElementById(px+'-tipo'), co=document.getElementById(px+'-color'), sk=document.getElementById(px+'-sku');
  const base=productosCache.filter(p=>(p.genero===g||p.genero==='unisex') && +p.precio_venta>0);
  if(nivel<1){ const tipos=[...new Set(base.map(p=>p.tipo))]; ti.innerHTML='<option value="">Prenda…</option>'+tipos.map(t=>`<option value="${t}">${cbEsc(prendaLabel(t))}</option>`).join(''); }
  if(nivel<2){ const cols=[...new Set(base.filter(p=>p.tipo===ti.value).map(p=>p.color))].sort(); co.innerHTML='<option value="">Color…</option>'+cols.map(c=>`<option>${cbEsc(c)}</option>`).join(''); }
  const tallas=base.filter(p=>p.tipo===ti.value && p.color===co.value).sort((a,b)=>TALLA_ORDER.indexOf(a.talla)-TALLA_ORDER.indexOf(b.talla));
  sk.innerHTML='<option value="">Talla…</option>'+tallas.map(p=>`<option value="${p.sku}">${p.talla}${px==='cb-e'?' · stock '+p.stock:''}</option>`).join('');

}
const pkProd = px => productosCache.find(p=>p.sku===(document.getElementById(px+'-sku')||{}).value) || null;

}

function cbCalc(){

    <div class="totline"><span class="muted">Recibe</span><span>${e?cbEsc(e.color)+' '+cbEsc(e.talla)+' · '+money(e.precio_venta):'—'}</span></div>
    <div class="totline"><span class="muted">Diferencia de precio</span><span>${dif>0?'cliente paga '+money(dif):dif<0?'le devolvemos '+money(-dif):'sin diferencia'}</span></div>

    <div class="totline big"><span>${devolver>cobrado?'Le devolvemos':'Cobrar al cliente'}</span><span>${money(Math.abs(cobrar-devolver))}</span></div>
    ${costo?`<div class="totline"><span class="muted">Nos cuesta el envío</span><span style="color:var(--red)">-${money(costo)}</span></div>`:''}`;
  return {s,e,dif,paga,cobrado,costo};
}

const cbFind=id=>CB_CACHE.find(x=>x.id===id);
async function cbUpd(id, upd, ok){ const { error } = await db.from('cambios').update(upd).eq('id',id); if(error){ toast('Error: '+error.message); return false; } toast(ok); renderCambios(); actualizarBadgeEnvios(); return true; }
function cbEnviado(id){

async function cbDevuelta(id){
  const x=cbFind(id); if(!x) return;
  const aTienda=confirm(`Llegó la prenda devuelta: ${x.sale_color} ${x.sale_talla}.\n\n¿Queda en la tienda para venderla?\nAceptar = sí, se suma al stock · Cancelar = no (vuelve a la proveedora o está dañada)`);
  if(aTienda && x.sale_sku){
    const { data:p } = await db.from('productos').select('stock').eq('sku',x.sale_sku).single();
    if(p) await db.from('productos').update({ stock:(p.stock||0)+1 }).eq('sku',x.sale_sku);
  }
  cbUpd(id, { devuelta_recibida:true, devuelta_a_tienda:aTienda }, aTienda?'📦 Recibida · +1 al stock':'📦 Prenda devuelta recibida');
}
function cbDinero(id, nuevo){
  const x=cbFind(id); if(!x) return;

  cbUpd(id, { diferencia_estado:nuevo }, '✓ Registrado');
}
function cbCerrar(id){
  const x=cbFind(id); if(!x) return;

  if(!confirm(pend.length?`Ojo: ${pend.join(' y ')}.\n¿Cerrar el cambio igual?`:'¿El cliente ya recibió su prenda nueva? Se cierra el cambio.')) return;

async function cbAnular(id){

  if(x.origen_nueva==='tienda' && x.estado==='pendiente' && x.entra_sku){

}

// ════════════ INGRESO DE MERCADERÍA — lo que la proveedora manda a la tienda ════════════
// No es venta: no suma ingresos ni comisión. Se paga a la proveedora con la semana (prendas + envío
// desde Guayaquil). Si ya llegó entra directo al stock con su fecha; si no, queda "en camino" hasta
// marcar "Llegó a la tienda". Las ventas de ese stock son 🏬 Local y nunca le llegan a la proveedora.
const fechaInput = d => { const x=new Date(d); return new Date(x-x.getTimezoneOffset()*60000).toISOString().slice(0,10); };
let MODO='venta', STOCK_ENVIO=ENVIO.provincia, STOCK_LLEGO=true, STOCK_FECHA=fechaInput(new Date());
function stockLlego(v){ STOCK_LLEGO=v; pintarStockCheckout(); }
function stockAyer(){ const d=new Date(); d.setDate(d.getDate()-1); STOCK_FECHA=fechaInput(d); pintarStockCheckout(); }
const lineasStock = its => its.map(i=>`• ${i.cantidad}x ${(i.nombre||'').replace('Camisa Manga Larga Polo Ralph Lauren','Camisa').replace('Cuello Redondo','Redonda')} ${i.color||''} ${i.talla||''}`.replace(/ +/g,' ').trim()).join('\n');
function setModo(m){ if(m===MODO) return; MODO=m; cart=[]; return renderVender(); }
async function irADropshipping(){ await setModo('venta'); setTipo('dropshipping'); }
const lunesDe = d => { const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const fechaCorta = d => new Date(d).toLocaleDateString('es-EC',{day:'numeric',month:'short'});
let STOCK_CONSIG=null;   // null = automático (perfumes → consignación)
const provsCarrito = () => [...new Set(cart.map(c=>provDe(c.sku)))];
const stockConsig = () => STOCK_CONSIG!==null ? STOCK_CONSIG : provsCarrito().includes('perfumes');
const montoPedido = p => p.consignacion ? (+p.costo_envio||0) : (+p.total||0);   // consignación: solo se debe el envío al llegar
function stockTotales(){
  const costo = Math.round(cart.reduce((s,c)=>s+c.costo_unit*c.cantidad,0)*100)/100;
  const envio = Math.max(0, +STOCK_ENVIO||0);
  const consig = stockConsig();
  return { costo, envio, consig, total: Math.round(((consig?0:costo)+envio)*100)/100, unidades: cart.reduce((s,c)=>s+c.cantidad,0) };
}

  if(e2){ await db.from('pedidos_stock').delete().eq('id',ped.id); toast('Error: '+e2.message); btn.disabled=false; btn.textContent=txt; return; }
  let entro=false;
  if(STOCK_LLEGO){

  document.getElementById('view').innerHTML = `

      <p class="muted" style="margin-bottom:1.3rem">${t.unidades} prenda(s) · ${money(t.total)} a la proveedora. ${entro?'Ya están en el inventario.':'Cuando llegue, márcalo en "Llegó a la tienda" y se suma al inventario.'}</p>
      <a class="btn btn-green" style="display:block;padding:1rem;text-decoration:none;font-size:16px" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">📲 Enviar referencia por WhatsApp</a>

function compartirSemanaStock(k){

  const tot=ls.reduce((s,p)=>s+montoPedido(p),0), ini=new Date(k), fin=new Date(ini); fin.setDate(fin.getDate()+6);
  const bloques=ls.map(p=>`#${p.folio} · ${fechaCorta(p.fecha)}${p.estado==='recibido'?'':' (en camino)'}\n${lineasStock((window._stockItems||[]).filter(i=>i.pedido_id===p.id))}\nPrendas ${money(p.costo_productos)} + Envío ${money(p.costo_envio)} = ${money(p.total)}`).join('\n\n');

async function recibirStock(id){
  const p=(window._stockCache||[]).find(x=>x.id===id); if(!p) return;
  if(!confirm(`¿Llegó el pedido de stock #${p.folio} a la tienda?\nLas prendas se suman al inventario.`)) return;
  const { error } = await db.rpc('recibir_pedido_stock',{ p_id:id, p_quien:VENDEDOR });
  if(error){ toast(/PEDIDO_YA_RECIBIDO/.test(error.message)?'Ese pedido ya se había recibido':'Error: '+error.message); return; }
  toast('✅ Prendas sumadas al inventario');
  await loadProductos(); renderVender();
}
async function anularStock(id){
  const p=(window._stockCache||[]).find(x=>x.id===id); if(!p) return;
  if(!confirm(`¿Anular el pedido de stock #${p.folio}?\nNo se suma al inventario y no se le paga a la proveedora.`)) return;
  const { error } = await db.from('pedidos_stock').update({ estado:'anulado' }).eq('id',id).eq('estado','pedido');
  if(error){ toast('Error: '+error.message); return; }
  toast('Pedido anulado'); renderStockLista();
}
async function pagarSemanaStock(k){
  const ls=(window._stockCache||[]).filter(p=>p.estado!=='anulado' && !p.pagado_at && lunesDe(p.fecha).toISOString()===k);
  if(!ls.length) return;
  const tot=ls.reduce((s,p)=>s+montoPedido(p),0);
  if(!confirm(`¿Ya le pagaste ${money(tot)} a la proveedora por ${ls.length} pedido(s) de stock?`)) return;
  const { error } = await db.from('pedidos_stock').update({ pagado_at:new Date().toISOString(), pagado_por:VENDEDOR }).in('id', ls.map(p=>p.id));
  if(error){ toast('Error: '+error.message); return; }
  toast('💸 Pago registrado'); renderStockLista();
}

// ════════════ CUENTAS (admin) — me deben (mayoristas) y debo (proveedores) ════════════
// Mayorista: cada entrega es una venta tipo 'mayorista' (a crédito o con pago) y los pagos van a mayorista_pagos.
//   Saldo = entregas − pagos. Si sale de la tienda descuenta stock; si la envía la proveedora, se le debe a ella.
// Proveedor: desde la fecha "desde" de config.proveedores se suma lo que se le debe:
//   · prendas que ella despachó (dropshipping, contra entrega, mayorista enviado) a su costo + el envío
//   · si consigna_local (perfumes): también lo vendido en el local, porque está en consignación
//   · pedidos de stock: compra = total; consignación = solo el envío
//   y se restan los pagos de proveedor_pagos. El préstamo de Fabiola (pedido 6) se lleva aparte.

    db.from('ventas').select('id,folio,fecha,total,mayorista_id,notas,zona_envio,costo_envio').not('mayorista_id','is',null).eq('anulada',false).order('fecha',{ascending:false}),
    db.from('mayorista_pagos').select('*').order('fecha',{ascending:false}),

    db.from('pedidos_stock').select('*').neq('estado','anulado').gte('fecha',desdeMin+'T00:00:00-05:00').order('fecha'),
    db.from('proveedor_pagos').select('*').order('fecha',{ascending:false})]);
  const ids=[...new Set([...(vmay||[]).map(x=>x.id),...(vprov||[]).map(x=>x.id)])];
  let its=[]; for(let i=0;i<ids.length;i+=150){ const {data}=await db.from('venta_items').select('*').in('venta_id',ids.slice(i,i+150)); its=its.concat(data||[]); }

    });
    const conEnvio = (vt.tipo==='dropshipping' || (vt.tipo==='mayorista' && vt.zona_envio==='provincia')) && (+vt.costo_envio>0);
    Object.entries(porProv).forEach(([k,ls])=>{
      const costo=ls.reduce((a,i)=>a+(+i.costo_unit||0)*i.cantidad,0), env=(conEnvio&&envioDe===k)?(+vt.costo_envio||0):0;
      P(k).lineas.push({vt,ls,costo,env,monto:costo+env}); P(k).cargos+=costo+env;
    });
  });
  (peds||[]).forEach(pd=>{ const k=pd.proveedor||'fabiola'; if(!PROVS[k]||pd.pagado_at) return; if(new Date(pd.fecha)<new Date(desdeDe(k))) return; const mt=montoPedido(pd); if(mt<=0) return; P(k).pedidos.push({pd,monto:mt}); P(k).cargos+=mt; });

  Object.keys(PROVS).forEach(k=>P(k));
  CU={mays,provs,itemsDe,nomCorto};
  const totMe=mays.reduce((a,x)=>a+Math.max(0,x.saldo),0), totDebo=Object.values(provs).reduce((a,x)=>a+(x.cargos-x.pagado),0);
  v.innerHTML = `

    </div>

      <div class="row" style="justify-content:space-between"><b>${x.m.nombre}</b><b style="color:${x.saldo>0.009?'var(--yellow)':'var(--green)'}">${x.saldo>0.009?'Debe '+money(x.saldo):'Al día'}</b></div>
      <div class="muted" style="font-size:12px">${[x.m.telefono,x.m.ciudad].filter(Boolean).join(' · ')}</div>
      <div class="totline" style="margin-top:.4rem"><span class="muted">Entregado</span><span>${money(x.tE)}</span></div>
      <div class="totline"><span class="muted">Pagado</span><span>${money(x.tP)}</span></div>
      <details style="margin-top:.4rem"><summary class="muted" style="font-size:12px;cursor:pointer">Ver entregas y pagos</summary>

          ...x.pag.map(pg=>({f:pg.fecha,h:`💵 Pago · ${fechaCorta(pg.fecha)} · <b style="color:var(--green)">${money(pg.monto)}</b>${pg.metodo?' · '+pg.metodo:''}${pg.nota?' · '+pg.nota:''}`}))]
          .sort((a,b)=>new Date(b.f)-new Date(a.f)).map(z=>`<div style="padding:.35rem 0;border-bottom:1px solid var(--border)">${z.h}</div>`).join('')||'<span class="muted">Sin movimientos</span>'}</div></details>
      <div class="grid2" style="margin-top:.6rem">

async function guardarGastoSoc(){

  if(!concepto||!(monto>0)){ toast('Escribe en qué y el monto'); return; }
  const f=document.getElementById('sg-fecha').value, esHoy=f===fechaInput(new Date());
  const { error } = await db.from('soc_movimientos').insert({ sociedad:'gorras', tipo:SG_TIPO, concepto, monto, pagado_por:document.getElementById('sg-quien').value,
    nota:(document.getElementById('sg-nota').value||'').trim()||null, fecha: esHoy?new Date().toISOString():new Date(f+'T12:00:00').toISOString(), registrado_por:VENDEDOR });

  closeModal(); toast('✅ Gasto guardado'); renderSocios();

async function guardarEdicionGastoSoc(id, fechaAntes){
  const concepto=(document.getElementById('sg-con').value||'').trim(), monto=Math.round((parseFloat(document.getElementById('sg-monto').value)||0)*100)/100;
  if(!concepto||!(monto>0)){ toast('Escribe en qué y el monto'); return; }
  const f=document.getElementById('sg-fecha').value;
  const cambios={ tipo:SG_TIPO, concepto, monto, pagado_por:document.getElementById('sg-quien').value, nota:(document.getElementById('sg-nota').value||'').trim()||null };
  if(f && f!==fechaAntes) cambios.fecha=new Date(f+'T12:00:00').toISOString();
  const { error } = await db.from('soc_movimientos').update(cambios).eq('id',id);
  if(error){ toast('Error: '+error.message); return; }
  closeModal(); toast('✅ Gasto corregido'); renderSocios();
}
async function eliminarGastoSoc(id){
  const g=((SOC&&SOC.gastos)||[]).find(x=>x.id===id); if(!g) return;
  if(!confirm(`¿Eliminar el gasto "${g.concepto}" de ${money(g.monto)}? No se puede deshacer.`)) return;
  const { error } = await db.from('soc_movimientos').delete().eq('id',id);
  if(error){ toast('Error: '+error.message); return; }
  closeModal(); toast('🗑️ Gasto eliminado'); renderSocios();
}
async function pagoCierreSoc(){
  let cfg={}; try{ cfg=JSON.parse(CONFIG.soc_gorras||'{}'); }catch(e){}
  const p=cfg.pendiente_cierre; if(!p) return;
  if(!confirm(`¿${p.de} ya le pagó ${money(p.monto)} a ${p.a} (cierre del 17 nov)?`)) return;

}

// Los datos viven en tablas rev_* (RLS activado) y se leen con funciones que piden el PIN.
// Flujo: el vendedor sube el pedido en su portal → aquí se revisa el pago → "Aprobar" lo registra
// como venta normal (dropshipping o contra entrega, sin stock de tienda) y entra a Envíos/CRM.
const PORTAL_URL = 'https://athleticastudiofit-star.github.io/polos593-catalogo/vendedores/';
const CATALOGO_URL = 'https://athleticastudiofit-star.github.io/polos593-catalogo/';
const staffPin = () => ES_ADMIN ? (CONFIG.pin_admin||'5930') : (CONFIG.pin||'0593');
let REV = null, REV_VISTA = 'revisar';
async function revRpc(fn, args){
  const { data, error } = await db.rpc(fn, args);
  if(error) throw error;
  return data;
}
function revError(e){
  const m = (e && e.message) || String(e);
  if(/Could not find the function|schema cache|does not exist/i.test(m)) return 'Falta activar el programa en Supabase (correr schema-v4-vendedores.sql)';
  const map = { PIN_INVALIDO:'PIN sin permiso para esto', PEDIDO_YA_REVISADO:'Este pedido ya fue revisado', VENTA_YA_ASIGNADA:'Esa venta ya tiene vendedor',
    VENDEDOR_NO_ACTIVO:'El vendedor no está activo', NADA_POR_PAGAR:'No hay nada por pagar', SIN_PRENDAS_CON_COMISION:'La venta no tiene prendas con comisión' };
  const k = Object.keys(map).find(c=>m.includes(c));
  return k ? map[k] : m;
}
const escH = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  try{
    const lista = await revRpc('rev_admin_lista',{p_pin:staffPin()});
    if(!lista.length) return;
    s.innerHTML = '<option value="">No, venta directa</option>' + lista.map(v=>`<option value="${v.id}">${escH(v.codigo)} · ${escH(v.nombre)}</option>`).join('');
    w.style.display='';
  }catch(e){ /* programa aún no activado: no se muestra */ }
}
function revVista(v){ REV_VISTA=v; pintarVendedores(); }
async function renderVendedores(){
  const view=document.getElementById('view');
  view.innerHTML='<div class="empty">Cargando vendedores…</div>';
  try{ REV = await revRpc('rev_admin_resumen',{p_pin:staffPin()}); }
  catch(e){ view.innerHTML=`<h2 class="page">Vendedores</h2><div class="card"><b>No se pudo cargar</b><div class="muted" style="margin-top:.4rem">${escH(revError(e))}</div></div>`; return; }
  pintarVendedores();
  const n=REV.pedidos.filter(p=>p.estado==='recibido').length, b=document.getElementById('nav-vend');
  if(b){ b.textContent=n; b.style.display=n?'':'none'; }
}
const REV_ENVIO = { recibido:'🕓 Por revisar', por_despachar:'📝 Por despachar', en_camino:'🚚 En camino', entregado:'✅ Entregado', depositado:'✅ Entregado', rechazado:'↩️ Rechazado', anulado:'✖ Anulado' };
const REV_COM = { ganada:'ganada', pagada:'pagada', en_camino:'al cobrar', por_revisar:'al aprobar', rechazado:'—', anulado:'—', kit:'kit' };
function pintarVendedores(){
  const view=document.getElementById('view'); if(!REV) return;
  const porRev = REV.pedidos.filter(p=>p.estado==='recibido');
  const aPagar = REV.vendedores.filter(v=>+v.saldo.por_cobrar>0);
  const totalLunes = aPagar.reduce((s,v)=>s+(+v.saldo.por_cobrar),0);
  const chip=(k,l)=>`<button onclick="revVista('${k}')" style="padding:.4rem .8rem;border-radius:20px;border:1px solid ${REV_VISTA===k?'var(--gold)':'var(--border)'};background:${REV_VISTA===k?'var(--gold)':'var(--surface2)'};color:${REV_VISTA===k?'#000':'var(--text)'};font-size:12px">${l}</button>`;
  let body='';
  if(REV_VISTA==='revisar'){
    body = porRev.length ? porRev.map(revCardRevisar).join('') : '<div class="empty">No hay pedidos por revisar 🎉</div>';
  } else if(REV_VISTA==='pedidos'){
    const otros = REV.pedidos.filter(p=>p.estado!=='recibido');
    body = otros.length ? `<div class="card" style="padding:.4rem .8rem">${otros.map(p=>`
      <div class="prod-pick" style="align-items:flex-start">
        <div style="flex:1;min-width:0"><b>${p.tipo==='kit'?'🎁 Kit':'#'+p.id} · ${escH(p.vendedor.nombre)}</b>
          <small style="display:block">${new Date(p.created_at).toLocaleDateString('es-EC',{day:'numeric',month:'short'})} · ${escH(p.cliente_nombre||'')} · ${p.prendas} prenda(s) · ${p.metodo_pago==='contraentrega'?'COD':'transf.'}${p.modalidad==='equipo'?' · cerró el equipo':''}${p.venta_folio?' · venta #'+p.venta_folio:''}</small>
          ${p.motivo_rechazo?`<small style="display:block;color:var(--red)">${escH(p.motivo_rechazo)}</small>`:''}</div>
        <div style="text-align:right;white-space:nowrap"><div style="font-size:12px">${REV_ENVIO[p.envio_estado]||p.envio_estado}</div>
          <small>${p.tipo==='kit'?money(p.total):money(p.com_monto||p.comision)+' '+(REV_COM[p.com_estado]||'')}</small></div>
      </div>`).join('')}</div>` : '<div class="empty">Todavía no hay pedidos</div>';
  } else if(REV_VISTA==='equipo'){
    body = REV.vendedores.length ? REV.vendedores.map(revCardVendedor).join('') : `<div class="empty">Aún no hay vendedores.<br>Comparte el portal: <b>${PORTAL_URL}</b></div>`;
  } else if(REV_VISTA==='pagos' && REV.es_admin){
    body = `<div class="kpis"><div class="kpi"><div class="l">💸 A pagar este lunes</div><div class="v" style="color:var(--gold)">${money(totalLunes)}</div><div class="muted" style="font-size:11px">${aPagar.length} vendedor(es)</div></div>
      <div class="kpi"><div class="l">🚚 Comisión por confirmar</div><div class="v">${money(REV.vendedores.reduce((s,v)=>s+(+v.saldo.en_camino),0))}</div><div class="muted" style="font-size:11px">contra entrega en camino</div></div></div>
      ${aPagar.length ? aPagar.map(v=>`<div class="card">
        <div class="row" style="justify-content:space-between"><b>${escH(v.nombre)} <span class="muted" style="font-weight:400">· ${escH(v.codigo)}</span></b><b style="color:var(--gold);font-size:18px">${money(v.saldo.por_cobrar)}</b></div>
        <div class="muted" style="font-size:12px;margin-top:.2rem">Comisiones ${money(v.saldo.comision_ganada)}${+v.saldo.bono_pendiente>0?' · Bono '+money(v.saldo.bono_pendiente)+' ('+v.saldo.bono_pendiente_meses.join(', ')+')':''}</div>
        <div style="font-size:13px;margin-top:.4rem">${v.numero_cuenta?`🏦 ${escH(v.banco||'')} · ${escH(v.tipo_cuenta||'')} <b>${escH(v.numero_cuenta)}</b><br>👤 ${escH(v.titular||v.nombre)}${v.cedula?' · CI '+escH(v.cedula):''}`:'<span style="color:var(--yellow)">⚠️ Sin cuenta bancaria registrada</span>'}</div>
        <button class="btn btn-gold" style="width:100%;margin-top:.6rem" onclick="revPagar('${v.id}')">💸 Ya le transferí ${money(v.saldo.por_cobrar)}</button></div>`).join('') : '<div class="empty">No hay comisiones por pagar</div>'}`;
  } else if(REV_VISTA==='ajustes' && REV.es_admin){
    body = `<div class="card"><b>Cuenta donde pagan los clientes</b>
        <div class="muted" style="font-size:12px;margin:.3rem 0 .6rem">La ven los vendedores en su portal para pasársela al cliente.</div>
        <textarea class="fld" id="rev-cuenta" rows="4" placeholder="Banco Pichincha · Ahorros 22XXXXXXXX&#10;Titular: …&#10;Cédula/RUC: …" style="resize:vertical">${escH(REV.cuenta_pago)}</textarea>
        <button class="btn btn-gold" style="width:100%;margin-top:.6rem" onclick="revGuardarCuenta()">Guardar cuenta</button></div>
      <div class="card"><b>Portal de vendedores</b>
        <div class="muted" style="font-size:12px;margin:.3rem 0 .6rem">Aquí se registran, suben pedidos y ven sus comisiones.</div>
        <div style="word-break:break-all;color:var(--gold)">${PORTAL_URL}</div>
        <button class="btn btn-ghost" style="width:100%;margin-top:.6rem" onclick="navigator.clipboard.writeText(PORTAL_URL).then(()=>toast('Link copiado'))">Copiar link</button></div>`;
  }
  view.innerHTML = `
    <h2 class="page">Vendedores <span class="muted" style="font-size:13px">· programa de reventa</span></h2>
    <div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.8rem">
      ${chip('revisar','Por revisar ('+porRev.length+')')}${chip('pedidos','Pedidos')}${chip('equipo','Equipo ('+REV.vendedores.length+')')}
      ${REV.es_admin?chip('pagos','Pagos del lunes'+(aPagar.length?' ('+aPagar.length+')':'')):''}${REV.es_admin?chip('ajustes','Ajustes'):''}
    </div>${body}`;
}
function revCardRevisar(p){
  const v=p.vendedor, kit=p.tipo==='kit';
  return `<div class="card env-card st-por_despachar">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><b>${kit?'🎁 KIT DE INICIO':'Pedido #'+p.id}</b> <span class="muted" style="font-size:12px">· ${new Date(p.created_at).toLocaleString('es-EC',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div>
      <span class="badge ${p.metodo_pago==='contraentrega'?'b-cod':'b-drop'}">${p.metodo_pago==='contraentrega'?'CONTRA ENTREGA':'TRANSFERENCIA'}</span>
    </div>
    <div style="font-size:13px;margin-top:.3rem">🤝 Vendedor: <b>${escH(v.nombre)}</b> (${escH(v.codigo)}) · <a style="color:var(--gold)" href="https://wa.me/593${String(v.telefono||'').replace(/^0/,'')}" target="_blank" rel="noopener">WhatsApp</a></div>
    <div style="font-size:13px;margin-top:.3rem">🧍 ${escH(p.cliente_nombre)} · 📞 ${escH(p.cliente_telefono||'—')}</div>
    <div style="font-size:13px">📍 ${escH(p.ciudad)} · 🏠 ${escH(p.direccion)}</div>
    <div class="muted" style="font-size:12px;margin-top:.3rem">${(p.items||[]).map(i=>`${i.cantidad}x ${escH(i.nombre)} · ${escH(i.color)} · ${escH(i.talla)}`).join('<br>')}</div>
    ${p.nota?`<div style="font-size:12px;margin-top:.3rem">📝 ${escH(p.nota)}</div>`:''}
    <div class="totline" style="margin-top:.4rem"><span>${kit?'💰 Paga el vendedor (envío incluido)':p.metodo_pago==='contraentrega'?'💰 Cobra Pardux al entregar':'💰 Pagó el cliente'}</span><b>${money(p.total)}</b></div>
    ${kit?'':`<div class="totline"><span class="muted">Comisión del vendedor</span><span style="color:var(--gold)">${money(p.comision)}</span></div>`}
    ${p.tiene_comprobante?`<button class="btn btn-ghost" style="width:100%;margin-top:.5rem" onclick="revComprobante(${p.id})">🧾 Ver comprobante de pago</button>`:''}
    <div class="grid2" style="margin-top:.5rem">
      <button class="btn btn-green" onclick="revAprobar(${p.id})">✅ ${p.metodo_pago==='transferencia'?'Pago recibido · aprobar':'Aprobar'}</button>
      <button class="btn btn-red" onclick="revRechazar(${p.id})">✖ Rechazar</button>
    </div></div>`;
}
function revCardVendedor(v){
  const est = {activo:['b-local','ACTIVO'], pendiente_kit:['b-cod','SIN KIT'], pausado:['b-drop','PAUSADO']}[v.estado]||['b-cod',v.estado];
  const mes = (v.saldo.meses||[]).find(m=>m.mes===v.saldo.mes_actual)||{prendas:0,comision:0};
  return `<div class="card">
    <div class="row" style="justify-content:space-between"><b>${escH(v.nombre)}</b><span class="badge ${est[0]}">${est[1]}</span></div>
    <div class="muted" style="font-size:12px">Código <b style="color:var(--gold)">${escH(v.codigo)}</b> · ${escH(v.telefono)}${v.ciudad?' · '+escH(v.ciudad):''} · desde ${new Date(v.desde).toLocaleDateString('es-EC',{day:'numeric',month:'short'})}</div>
    <div class="grid2" style="margin-top:.6rem;font-size:13px">
      <div>Este mes: <b>${mes.prendas}</b> prendas · ${money(mes.comision)}</div>
      <div style="text-align:right">Por pagar: <b style="color:var(--gold)">${money(v.saldo.por_cobrar)}</b></div>
    </div>
    <div class="muted" style="font-size:11px;margin-top:.3rem;word-break:break-all">${CATALOGO_URL}?ref=${escH(v.codigo)}</div>
    ${REV.es_admin?`<div class="grid2" style="margin-top:.6rem">
      ${v.estado==='pausado'?`<button class="btn btn-ghost" onclick="revEstado('${v.id}','activo')">▶️ Reactivar</button>`
        :v.estado==='pendiente_kit'?`<button class="btn btn-ghost" onclick="revEstado('${v.id}','activo')" title="Activar sin kit">✓ Activar sin kit</button>`
        :`<button class="btn btn-ghost" onclick="revEstado('${v.id}','pausado')">⏸ Pausar</button>`}
      <button class="btn btn-ghost" onclick="revNuevoPin('${v.id}')">🔑 Nuevo PIN</button></div>`:''}
  </div>`;
}
async function revComprobante(id){
  showModal('<div class="empty">Cargando comprobante…</div>');
  try{
    const src = await revRpc('rev_admin_comprobante',{p_pin:staffPin(), p_id:id});
    showModal(`<b>Comprobante · pedido #${id}</b><img src="${src}" alt="Comprobante" style="width:100%;border-radius:10px;margin-top:.7rem">
      <button class="btn btn-ghost" style="width:100%;margin-top:.7rem" onclick="closeModal()">Cerrar</button>`);
  }catch(e){ showModal(`<b>No se pudo cargar</b><div class="muted">${escH(revError(e))}</div>`); }
}
async function revRechazar(id){
  const motivo = prompt('¿Por qué se rechaza? (lo ve el vendedor)\nEj: No llegó la transferencia / Talla agotada');
  if(motivo===null) return;
  try{ await revRpc('rev_admin_rechazar',{p_pin:staffPin(), p_id:id, p_motivo:motivo, p_quien:VENDEDOR}); toast('Pedido rechazado'); renderVendedores(); }
  catch(e){ toast(revError(e)); }
}
// Aprobar = registrar la venta como cualquier otra (Envíos/CRM/Reportes) y vincularla al pedido
async function revAprobar(id){
  const p = REV.pedidos.find(x=>x.id===id); if(!p) return;
  const kit = p.tipo==='kit', esCOD = p.metodo_pago==='contraentrega';
  if(!confirm(kit ? `¿Ya llegó la transferencia de ${money(p.total)} de ${p.vendedor.nombre}?\nSe registra la venta del kit y se activa su cuenta.`
          : esCOD ? `¿Aprobar el pedido #${id} contra entrega por ${money(p.total)}?\nPasa a Envíos para despacharlo por Pardux.`
          : `¿Ya llegó la transferencia de ${money(p.total)} del cliente ${p.cliente_nombre}?`)) return;
  if(!productosCache.length) await loadProductos();
  const items = (p.items||[]).map(i=>{ const pr=productosCache.find(x=>x.sku===i.sku)||{};
    return { sku:i.sku, nombre:i.nombre, talla:i.talla, color:i.color, cantidad:+i.cantidad, precio_unit:+i.precio, costo_unit:+(pr.costo||0) }; });
  const subtotal = items.reduce((s,i)=>s+i.precio_unit*i.cantidad,0);
  const costo = items.reduce((s,i)=>s+i.costo_unit*i.cantidad,0);
  const zona = esCOD ? 'pardux' : (/guayaquil/i.test(p.ciudad||'') ? 'guayaquil' : 'provincia');
  const envioCobrado = +p.envio||0;
  const costoEnvio = esCOD ? envioCobrado : ENVIO[zona];        // Pardux: el costo real se carga con la guía
  const total = +p.total;
  const desc = Math.round((subtotal + envioCobrado - total)*100)/100;  // el kit va con descuento (precio menos comisión)
  const venta = {
    tipo: esCOD?'contraentrega':'dropshipping', vendedor: (kit?'Kit · ':'Vend · ')+p.vendedor.nombre,
    cliente_nombre:p.cliente_nombre, cliente_telefono:p.cliente_telefono, cedula:p.cliente_cedula||null,
    ciudad:p.ciudad, zona_envio:zona, costo_envio:costoEnvio, envio_cobrado:envioCobrado,
    descuento_tipo: desc?'monto_final':null, descuento_valor: desc?total:0, descuento_monto:desc,
    subtotal, total, costo_productos:costo, ganancia: Math.round((total-costo-costoEnvio)*100)/100,
    metodo_pago: esCOD?'Contra entrega':'Transferencia', notas:p.direccion
  };
  if(esCOD){ venta.estado_envio='por_despachar'; venta.estado_envio_at=new Date().toISOString(); }
  const { data:vRow, error } = await db.from('ventas').insert(venta).select().single();
  if(error){ toast('Error: '+error.message); return; }
  const { error:e2 } = await db.from('venta_items').insert(items.map(i=>({venta_id:vRow.id, sku:i.sku, nombre:i.nombre, talla:i.talla, cantidad:i.cantidad, precio_unit:i.precio_unit, costo_unit:i.costo_unit, es_local:false})));
  try{
    if(e2) throw e2;
    await revRpc('rev_admin_aprobar',{p_pin:staffPin(), p_id:id, p_venta_id:vRow.id, p_quien:VENDEDOR});
  }catch(e){
    await db.from('ventas').delete().eq('id',vRow.id);   // sin vínculo no queda una venta suelta
    toast('No se aprobó: '+revError(e)); renderVendedores(); return;
  }
  venta.direccion = p.direccion;
  await sincronizarCRM(venta, items, vRow.folio);
  if(esCOD) actualizarBadgeEnvios();
  revBadge();
  mostrarCompartir(vRow.folio, venta, items);
}
async function revPagar(vid){
  const v = REV.vendedores.find(x=>x.id===vid); if(!v) return;
  const ref = prompt(`Pago a ${v.nombre}: ${money(v.saldo.por_cobrar)}\n\nN° de la transferencia (opcional):`);
  if(ref===null) return;
  try{
    const r = await revRpc('rev_admin_liquidar',{p_pin:staffPin(), p_vendedor:vid, p_referencia:ref, p_quien:VENDEDOR});
    toast(`✓ Pago de ${money(r.total)} registrado`); renderVendedores();
  }catch(e){ toast(revError(e)); }
}
async function revEstado(vid, estado){
  if(estado==='pausado' && !confirm('¿Pausar a este vendedor? No podrá entrar ni subir pedidos.')) return;
  try{ await revRpc('rev_admin_vendedor',{p_pin:staffPin(), p_id:vid, p_estado:estado, p_pin_nuevo:null}); toast('✓ Actualizado'); renderVendedores(); }
  catch(e){ toast(revError(e)); }
}
async function revNuevoPin(vid){
  const pin = prompt('Nuevo PIN para el vendedor (4 a 6 números). Se lo pasas por WhatsApp:');
  if(!pin) return;
  try{ await revRpc('rev_admin_vendedor',{p_pin:staffPin(), p_id:vid, p_estado:null, p_pin_nuevo:pin.trim()}); toast('✓ PIN cambiado'); }
  catch(e){ toast(revError(e)); }
}
async function revGuardarCuenta(){
  try{ await revRpc('rev_admin_cuenta_pago',{p_pin:staffPin(), p_texto:document.getElementById('rev-cuenta').value}); toast('✓ Cuenta guardada'); renderVendedores(); }
  catch(e){ toast(revError(e)); }
}

// ── init ──
initLogin();
</script>
